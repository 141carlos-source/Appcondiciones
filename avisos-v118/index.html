<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>APP Avisos V1.18 · Plano guardado en ficha</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
body{height:100dvh}iframe{display:block;border:0;width:100%;height:100%;background:#f4f7fb}
#err{display:none;position:fixed;inset:12px;z-index:10;background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:16px;color:#b42318;overflow:auto}
</style>
</head>
<body>
<div id="err"></div>
<iframe id="app" title="APP Avisos V1.18" src="../avisos-v117b/"></iframe>
<script>
(function(){'use strict';
var fr=document.getElementById('app'),DB_NAME='APP_AVISOS_PERSISTENCIA',DB_PLANOS='planos',DB_VERSION=2,DATA_KEY='APP_AVISOS_WEB_DATOS_V116_PERSISTENTE';
var DRAFT='__plano_draft__',workKey=DRAFT,workHas=false,workDeleted=false,previewUrl='',observer=null,autoTimer=null,lastAutoCoords='';
function showErr(msg){var b=document.getElementById('err');b.textContent=msg;b.style.display='block';}
function doc(){return fr.contentDocument;} function win(){return fr.contentWindow;}
function val(id){var e=doc().getElementById(id);return e?String(e.value||'').trim():'';}
function status(msg,bad){var e=doc().getElementById('cartoEstado');if(e){e.textContent=msg||'';e.style.color=bad?'#b42318':'#15803d';}}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return Number.isFinite(n)?n:null;}
function openDb(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains('estado'))db.createObjectStore('estado');if(!db.objectStoreNames.contains(DB_PLANOS))db.createObjectStore(DB_PLANOS);};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error||new Error('No se pudo abrir IndexedDB'))};});}
function dbGet(k){return openDb().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction(DB_PLANOS,'readonly'),r=tx.objectStore(DB_PLANOS).get(String(k));r.onsuccess=function(){var v=r.result;db.close();resolve(v||null)};r.onerror=function(){var e=r.error;db.close();reject(e)}})});}
function dbPut(k,v){return openDb().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction(DB_PLANOS,'readwrite');tx.objectStore(DB_PLANOS).put(v,String(k));tx.oncomplete=function(){db.close();resolve(true)};tx.onerror=function(){var e=tx.error;db.close();reject(e)}})});}
function dbDel(k){return openDb().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction(DB_PLANOS,'readwrite');tx.objectStore(DB_PLANOS).delete(String(k));tx.oncomplete=function(){db.close();resolve(true)};tx.onerror=function(){var e=tx.error;db.close();reject(e)}})});}
function dbCopy(a,b){return dbGet(a).then(function(v){if(!v)return false;return dbPut(b,{blob:v.blob,nombre:v.nombre,generadoEn:v.generadoEn,latitud:v.latitud,longitud:v.longitud,direccion:v.direccion,refCatastral:v.refCatastral}).then(function(){return true})});}
function dbMove(a,b){if(String(a)===String(b))return Promise.resolve(true);return dbGet(a).then(function(v){if(!v)return false;return dbPut(b,v).then(function(){return dbDel(a)}).then(function(){return true})});}
function revoke(){if(previewUrl){try{URL.revokeObjectURL(previewUrl)}catch(e){}previewUrl='';}}
function meta(v){var p=[];if(v&&v.generadoEn){try{p.push('Generado: '+new Date(v.generadoEn).toLocaleString('es-ES'))}catch(e){}}if(v&&v.latitud&&v.longitud)p.push('Coordenadas: '+v.latitud+', '+v.longitud);if(v&&v.refCatastral)p.push('Ref. catastral: '+v.refCatastral);if(v&&v.nombre)p.push('Archivo: '+v.nombre);return p.join(' · ');}
function renderPlan(){var d=doc(),img=d.getElementById('v118PlanoImg'),empty=d.getElementById('v118PlanoEmpty'),m=d.getElementById('v118PlanoMeta');if(!img||!empty||!m)return Promise.resolve(false);m.textContent='Comprobando plano guardado…';return dbGet(workKey).then(function(v){revoke();if(!v||!v.blob){workHas=false;img.removeAttribute('src');img.style.display='none';empty.style.display='block';m.textContent='Sin plano guardado en esta ficha.';return false}workHas=true;workDeleted=false;previewUrl=URL.createObjectURL(v.blob);img.src=previewUrl;img.style.display='block';empty.style.display='none';m.textContent=meta(v);return true}).catch(function(e){m.textContent='No se pudo leer el plano guardado.';return false});}
function prepareNew(clear){workKey=DRAFT;workHas=false;workDeleted=false;lastAutoCoords='';return (clear?dbDel(workKey).catch(function(){}):Promise.resolve()).then(renderPlan);}
function prepareEdit(id,clear){workKey='__edit_plano__'+String(id);workHas=false;workDeleted=false;lastAutoCoords='';var p=clear?dbDel(workKey).catch(function(){}):Promise.resolve();return p.then(function(){return dbGet(workKey)}).then(function(v){if(v)return true;return dbCopy(String(id),workKey)}).then(renderPlan);}
function prepareDuplicate(id){workKey=DRAFT;workHas=false;workDeleted=false;lastAutoCoords='';return dbDel(workKey).catch(function(){}).then(function(){return dbCopy(String(id),workKey)}).then(renderPlan);}
function discard(){var k=workKey;revoke();workHas=false;workDeleted=false;lastAutoCoords='';if(k===DRAFT||String(k).indexOf('__edit_plano__')===0)return dbDel(k).catch(function(){});return Promise.resolve();}
function confirmPlan(finalId){var from=workKey,to=String(finalId);if(workDeleted)return Promise.all([dbDel(to).catch(function(){}),dbDel(from).catch(function(){})]).then(function(){return false});if(workHas)return dbMove(from,to);return dbDel(from).catch(function(){}).then(function(){return false});}
function merc(lon,lat){var R=6378137,x=R*lon*Math.PI/180,c=Math.max(-85.05112878,Math.min(85.05112878,lat)),y=R*Math.log(Math.tan(Math.PI/4+(c*Math.PI/180)/2));return{x:x,y:y};}
function loadImage(url){return new Promise(function(resolve,reject){var im=new Image();im.crossOrigin='anonymous';im.onload=function(){resolve(im)};im.onerror=function(){reject(new Error('No se pudo cargar la cartografía IGN'))};im.src=url;});}
function fileName(){var b=(val('avCliente')||val('avDireccion')||'suministro').replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60),x=new Date(),m=String(x.getMonth()+1).padStart(2,'0'),da=String(x.getDate()).padStart(2,'0');return 'plano_'+(b||'suministro')+'_'+x.getFullYear()+'-'+m+'-'+da+'.png';}
function generateBlob(){var lat=num(val('avLatitud')),lon=num(val('avLongitud'));if(lat===null||lon===null)return Promise.reject(new Error('Primero obtén las coordenadas del suministro.'));var p=merc(lon,lat),hx=220,hy=165,W=1200,H=900,bbox=[p.x-hx,p.y-hy,p.x+hx,p.y+hy].join(','),url='https://www.ign.es/wms-inspire/ign-base?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=IGNBaseTodo&STYLES=&CRS=EPSG:3857&BBOX='+encodeURIComponent(bbox)+'&WIDTH='+W+'&HEIGHT='+H+'&FORMAT=image/png&TRANSPARENT=FALSE';return loadImage(url).then(function(im){var c=document.createElement('canvas');c.width=W;c.height=H+150;var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,W,H);var px=W/2,py=H/2;ctx.beginPath();ctx.arc(px,py,16,0,Math.PI*2);ctx.fillStyle='#d92d20';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.moveTo(px,py+14);ctx.lineTo(px,py+42);ctx.lineWidth=7;ctx.strokeStyle='#d92d20';ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(0,H,W,150);ctx.fillStyle='#182033';ctx.font='bold 28px Arial';ctx.fillText('PLANO DE SITUACIÓN',28,H+38);ctx.font='20px Arial';var dir=[val('avDireccion'),val('avCp'),val('avLocalidad'),val('avProvincia')].filter(Boolean).join(' · ');ctx.fillText((dir||'Suministro').slice(0,100),28,H+72);var ref=val('avRefCatastral');ctx.font='18px Arial';ctx.fillText('Coordenadas WGS84: '+lat+', '+lon+(ref?'   ·   Ref. catastral: '+ref:''),28,H+104);ctx.font='15px Arial';ctx.fillStyle='#667085';ctx.fillText('Cartografía base: © Instituto Geográfico Nacional · APP Avisos',28,H+133);return new Promise(function(resolve,reject){c.toBlob(function(blob){if(!blob){reject(new Error('No se pudo generar la imagen'));return}resolve({blob:blob,nombre:fileName(),generadoEn:new Date().toISOString(),latitud:String(lat),longitud:String(lon),direccion:dir,refCatastral:ref})},'image/png',0.95)})});}
function generateSave(auto){var coords=val('avLatitud')+','+val('avLongitud');if(auto&&coords===lastAutoCoords)return Promise.resolve(false);if(auto)lastAutoCoords=coords;status(auto?'Generando y guardando plano automáticamente…':'Generando y guardando plano…',false);return generateBlob().then(function(r){return dbPut(workKey,r).then(function(){workHas=true;workDeleted=false;return renderPlan()}).then(function(){status('Plano guardado dentro de la ficha.',false);return true})}).catch(function(e){status('No se pudo guardar el plano: '+e.message,true);return false});}
function autoAfterCoords(){clearTimeout(autoTimer);autoTimer=setTimeout(function(){if(val('avLatitud')&&val('avLongitud'))generateSave(true)},700);}
function downloadSaved(){dbGet(workKey).then(function(v){if(!v||!v.blob){status('No hay un plano guardado para descargar.',true);return}var a=document.createElement('a');a.href=URL.createObjectURL(v.blob);a.download=v.nombre||fileName();document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);status('Plano descargado en el terminal.',false)})}
function viewSaved(){dbGet(workKey).then(function(v){if(!v||!v.blob){status('No hay un plano guardado para ver.',true);return}var u=URL.createObjectURL(v.blob),w=window.open(u,'_blank');if(!w){URL.revokeObjectURL(u);status('El navegador bloqueó la apertura del plano.',true);return}setTimeout(function(){try{URL.revokeObjectURL(u)}catch(e){}},60000)})}
function deleteSaved(){if(!workHas){status('No hay un plano guardado en esta ficha.',true);return}if(!confirm('¿Eliminar el plano guardado de esta ficha?'))return;dbDel(workKey).then(function(){workHas=false;workDeleted=true;renderPlan();status('Plano eliminado de la ficha. Guarda el aviso para confirmar.',false)})}
function parseData(){try{return JSON.parse(localStorage.getItem(DATA_KEY)||'{}')}catch(e){return{}}}
function ids(){var p=parseData(),a=Array.isArray(p.avisos)?p.avisos:[];return a.map(function(x){return Number(x.id)}).filter(Boolean)}
function detectNew(before){var after=ids(),set={};before.forEach(function(x){set[x]=1});var fresh=after.filter(function(x){return !set[x]});if(fresh.length)return Math.max.apply(Math,fresh);return after.length?Math.max.apply(Math,after):0;}
function injectPanel(){
  var d=doc();if(d.getElementById('v118PlanoBox'))return;
  var st=d.createElement('style');st.textContent='.v118Plano{border:1px solid #c9d7e8;border-radius:14px;padding:11px;background:#fff;margin:0 0 12px}.v118Preview{min-height:190px;display:flex;align-items:center;justify-content:center;border:1px solid #dbe3ee;border-radius:12px;background:#f7f9fc;overflow:hidden;margin-top:8px}.v118Preview img{display:none;width:100%;height:auto;max-height:420px;object-fit:contain}.v118Empty{color:#6f7b8f;font-size:12px;text-align:center;padding:24px}.v118Meta{font-size:12px;color:#6f7b8f;line-height:1.45;margin:8px 0}.v118Actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.v118Actions .wide{grid-column:1/-1}';d.head.appendChild(st);
  var carto=d.querySelector('.cartoBox');if(!carto)return;
  var box=d.createElement('div');box.id='v118PlanoBox';box.className='v118Plano wide';box.innerHTML='<strong style="font-size:13px">Plano de situación guardado</strong><p class="muted" style="margin:6px 0">Queda asociado a este aviso para incorporarlo después a la Memoria Técnica.</p><div class="v118Preview"><img id="v118PlanoImg" alt="Plano de situación guardado"><div id="v118PlanoEmpty" class="v118Empty">Aún no hay un plano guardado en esta ficha.</div></div><div id="v118PlanoMeta" class="v118Meta"></div><div class="v118Actions"><button type="button" class="primary wide" id="v118Gen">Generar / actualizar y guardar plano</button><button type="button" id="v118View">Ver plano guardado</button><button type="button" id="v118Down">⬇ Descargar plano</button><button type="button" class="danger wide" id="v118Del">Eliminar plano de la ficha</button></div>';
  carto.insertAdjacentElement('afterend',box);
  d.getElementById('v118Gen').onclick=function(){generateSave(false)};d.getElementById('v118View').onclick=viewSaved;d.getElementById('v118Down').onclick=downloadSaved;d.getElementById('v118Del').onclick=deleteSaved;
}
function wrapApp(){
  var w=win(),d=doc(),A=w.App;if(!A)throw new Error('La aplicación base no terminó de cargar');
  d.title='APP Avisos V1.18';var sub=d.querySelector('header .headerText small');if(sub)sub.textContent='V1.18 PRUEBA · Plano guardado en ficha';var intro=d.querySelector('#inicio .muted');if(intro)intro.textContent='V1.18 obtiene coordenadas automáticamente y guarda el plano dentro de la ficha del aviso.';
  injectPanel();
  var oldNuevo=A.nuevoAviso,oldEdit=A.editarAviso,oldDup=A.duplicarAviso,oldCancel=A.cancelarAviso,oldSave=A.guardarAviso,oldElegir=A.elegirCarto,oldDir=A.buscarCartoDireccion,oldRef=A.buscarCartoRef,oldBorrar=A.borrarDefinitivo;
  A.nuevoAviso=function(){var r=oldNuevo.apply(A,arguments);prepareNew(true);return r};
  A.editarAviso=function(id){var r=oldEdit.apply(A,arguments);prepareEdit(id,true);return r};
  A.duplicarAviso=function(id){var r=oldDup.apply(A,arguments);prepareDuplicate(id);return r};
  A.cancelarAviso=function(){discard();return oldCancel.apply(A,arguments)};
  A.elegirCarto=function(){var r=oldElegir.apply(A,arguments);setTimeout(autoAfterCoords,100);return r};
  A.buscarCartoDireccion=function(){lastAutoCoords='';var r=oldDir.apply(A,arguments);setTimeout(function(){var first=d.querySelector('#cartoResultados .cartoResult');if(first&&!val('avLatitud')&&!val('avLongitud'))A.elegirCarto(0);else autoAfterCoords()},450);return r};
  A.buscarCartoRef=function(){lastAutoCoords='';var r=oldRef.apply(A,arguments);setTimeout(function(){var first=d.querySelector('#cartoResultados .cartoResult');if(first&&!val('avLatitud')&&!val('avLongitud'))A.elegirCarto(0);else autoAfterCoords()},450);return r};
  var results=d.getElementById('cartoResultados');if(results){observer=new MutationObserver(function(){var first=results.querySelector('.cartoResult');if(first&&!val('avLatitud')&&!val('avLongitud'))A.elegirCarto(0);else if(val('avLatitud')&&val('avLongitud'))autoAfterCoords()});observer.observe(results,{childList:true,subtree:true})}
  ['avLatitud','avLongitud'].forEach(function(id){var e=d.getElementById(id);if(e)e.addEventListener('change',autoAfterCoords)});
  A.guardarAviso=function(){var before=ids(),editId=Number(val('avId'))||0,r=oldSave.apply(A,arguments);setTimeout(function(){var form=d.getElementById('formAviso');if(form&&form.style.display!=='none')return;var finalId=editId||detectNew(before);if(finalId){confirmPlan(finalId).then(function(){workKey=DRAFT;workHas=false;workDeleted=false;lastAutoCoords=''})}},50);return r};
  A.borrarDefinitivo=function(id){var p=parseData(),before=(Array.isArray(p.papelera)?p.papelera:[]).some(function(x){return Number(x.id)===Number(id)}),r=oldBorrar.apply(A,arguments);setTimeout(function(){var q=parseData(),still=(Array.isArray(q.papelera)?q.papelera:[]).some(function(x){return Number(x.id)===Number(id)});if(before&&!still)dbDel(String(id)).catch(function(){})},50);return r};
  var form=d.getElementById('formAviso'),existingId=Number(val('avId'))||0;if(form&&form.style.display!=='none'){if(existingId)prepareEdit(existingId,false);else prepareNew(false)}else prepareNew(false);
}
fr.addEventListener('load',function(){setTimeout(function(){try{wrapApp()}catch(e){console.warn(e);showErr('No se pudo iniciar V1.18: '+e.message)}},300)});
})();
</script>
</body></html>
