<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUADROLAB SOLTEC</title><style>
:root{--r:#B3141C;--g:#4a4f55;--l:#d5d8dc}
*{box-sizing:border-box}
body{margin:0;font:13px Arial,Helvetica,sans-serif;color:#222;background:#f4f5f6;text-transform:uppercase}
input,select,button{font:inherit;text-transform:uppercase}
header{background:#fff;border-bottom:3px solid var(--r);padding:10px 20px;display:flex;align-items:center;gap:20px}
header img{display:block}.hi{font-size:11px;color:var(--g);line-height:1.5}.hi b{font-size:15px;color:#111;display:block}
header .hi:first-of-type{flex:1}
nav{background:#2b2e33;display:flex;flex-wrap:wrap}
nav button{background:none;border:0;color:#cfd2d6;padding:11px 18px;cursor:pointer;letter-spacing:.5px;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--r);background:#383c42}
main{padding:18px 20px}h2{font-size:14px;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--l);color:#111;letter-spacing:.5px}
.card{background:#fff;border:1px solid var(--l);padding:14px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--g);letter-spacing:.4px}
input,select{border:1px solid #b9bdc2;padding:6px 7px;background:#fff;color:#111;min-width:90px}
button.b{background:var(--r);color:#fff;border:0;padding:8px 14px;cursor:pointer}
button.s{background:#fff;color:#222;border:1px solid #9aa0a6;padding:7px 13px;cursor:pointer}button:hover{opacity:.85}
.stk{position:sticky;top:0;z-index:5}.bot{position:sticky;bottom:0;z-index:5;display:flex;gap:14px;align-items:stretch;max-height:34vh;background:#f4f5f6;padding-top:6px}.bot .card{flex:1;overflow:auto;margin-bottom:0}.dv{scroll-margin:210px 0 280px}
.sec{display:none}.sec.on{display:block}
.lib{display:flex;flex-wrap:wrap;gap:10px 22px}.lg{display:flex;gap:6px;align-items:center}.lg span{font-size:10px;color:var(--g)}
.tl{border:1px solid #8a9096;background:#fff;padding:7px 6px;cursor:grab;font-size:10px;min-width:34px;text-align:center} .tl.sl{cursor:pointer;font:inherit;font-size:10px;font-weight:700;padding:6px 4px;border-radius:0;color:#111}
.row{position:relative;height:190px;margin:0 0 10px;border:1px solid #9aa0a6;background:linear-gradient(90deg,#e3e5e8 1px,transparent 1px) 0 0/34px 100%,#fafafa}
.dv{position:absolute;top:4px;bottom:4px;border:1px solid #333;border-top:4px solid #333;background:#fff;display:flex;flex-direction:column;align-items:center;padding:0 1px 3px;font-size:9px;cursor:grab;overflow:hidden;text-align:center}
.dv.ID{border-top-color:var(--r)}.dv.IGA{background:#e9eaec;border-top-color:#111}.dv.on{outline:2px solid var(--r)}
.dv i{font-style:normal;flex:1;overflow:hidden;margin-top:3px;line-height:1.1;word-break:break-word;text-align:center;width:100%}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #c4c8cc;padding:6px 8px;text-align:left}th{background:#2b2e33;color:#fff;font-size:11px}
.sheet{width:190mm;display:flex;flex-wrap:wrap;align-content:flex-start;background:#fff;border:1px solid var(--l)}
.lb{display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:bold;color:#000}.lb span{white-space:nowrap}
.dv b{margin-top:3px}.dv img{flex:none;height:96px;width:100%;object-fit:contain;pointer-events:none}.dv small{font-size:8px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rs{position:absolute;top:8px;bottom:8px;border:1px dashed #b3b7bc;color:#9aa0a6;font-size:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cut .lb{outline:.2mm dashed #777}
#t1 .card{background:#d9dce0}
.a4{width:100%;max-width:1123px;min-width:640px;aspect-ratio:297/210;margin:0 auto 14px;background:#fff;border:1px solid #8a9096;box-shadow:0 3px 14px #0004;padding:2.7%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.a4h{display:flex;align-items:center;gap:20px;border-bottom:2px solid var(--r);padding-bottom:4px;margin-bottom:4px;flex:none}.a4h img{height:7mm!important;max-height:26px} .a4h{padding-bottom:2px!important;margin-bottom:2px!important;border-bottom-width:1.5px!important} .a4h .hi{font-size:7.5px!important;line-height:1.3!important} .a4h .hi b{font-size:10px!important} .a4 table{margin-top:3px!important} .a4 table td{padding:1px 5px!important;font-size:7.5px;line-height:1.2} .a4 table td b{font-size:8.5px} .a4 table td small{font-size:6.5px} .a4 table td br{display:none} .a4 table td small:after{content:' '} .a4 table img{height:7mm!important;max-height:26px}.a4h .hi:first-of-type{flex:1}
.a4 svg{flex:1 1 0;min-height:0;width:100%;max-width:none!important}.a4 table{margin-top:6px;flex:none}
body{-webkit-text-size-adjust:100%}#frw{overflow-x:auto}
@media(max-width:760px){
header{flex-wrap:wrap;gap:8px;padding:8px 10px}header .hi{font-size:10px}
nav{overflow-x:auto;flex-wrap:nowrap}nav button{padding:12px 14px;white-space:nowrap}
main{padding:10px}.card{padding:10px;overflow-x:auto}
.stk{position:static}.bot{flex-direction:column;max-height:38vh;overflow:auto}.dv{scroll-margin:20px 0 300px}
input,select{font-size:16px;min-height:38px}button.b,button.s{padding:10px 14px;min-height:40px}
.bar{gap:8px}.sheet{width:100%;overflow-x:auto}#t1 svg{min-width:900px}}
@page{size:A4;margin:10mm}@page uni{size:A4 landscape;margin:8mm}
@media print{body[data-tab="1"] header,#t1 h2{display:none!important}.a4h{display:flex}#t1 .card{background:#fff}.a4{box-shadow:none;border:0;padding:0;aspect-ratio:auto;max-width:none;min-width:0;margin:0;display:block;overflow:visible}.a4 svg{flex:none;width:100%!important}#t1{page:uni}#t1 svg{width:100%!important;max-width:none!important;max-height:116mm;height:auto;display:block;margin:0 auto}#t1 table{page-break-inside:avoid;font-size:9px}#t1 td,#t1 th{padding:3px 6px}body{background:#fff}nav,.noprint{display:none!important}main{padding:0}.card{border:0;padding:0}header{padding:0 0 6px}.sheet{border:0}#frw{zoom:.8}}
