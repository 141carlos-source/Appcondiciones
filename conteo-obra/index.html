<style>

@media(prefers-color-scheme:dark){:root{--bg:#0f0f11;--card:#1a1a1d;--ink:#f2f2f3;--mut:#a1a1aa;--line:#2e2e33;--hd:#161618;--ac:#f2f2f3;--acink:#18181b;--soft:#3a0f16}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--hd);color:var(--ink);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--p);box-shadow:0 2px 10px #0000001a}
header h1{font-family:"Exo 2",system-ui,sans-serif;font-weight:700;font-size:18px;margin:0;flex:1;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header small{display:block;font-family:system-ui,sans-serif;font-weight:400;color:var(--mut);font-size:12px}
.hb{background:var(--bg);border:1px solid var(--line);color:var(--ink);min-width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer}
.logo{height:44px;max-width:140px;object-fit:contain;background:#fff;border-radius:8px;padding:3px 6px}
.hb+.logo{height:36px;max-width:100px}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.job{display:flex;gap:12px;align-items:center;cursor:pointer}
.job b{display:block}.job span{color:var(--mut);font-size:14px}
.job .n{margin-left:auto;text-align:right;font-weight:700;font-size:20px;color:var(--p)}
.job .n small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.btn{border:0;border-radius:12px;min-height:48px;padding:0 16px;background:var(--p);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ac{background:var(--ac);color:var(--acink)}
.btn.bad{background:var(--bad)}
.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.tabs{display:flex;position:sticky;top:64px;z-index:15;background:var(--bg);padding:8px 14px 0;gap:6px;max-width:760px;margin:0 auto;overflow-x:auto}
.tabs button{flex:1;border:0;background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:42px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap;padding:0 10px}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--p)}
.cap{font-family:"Exo 2",system-ui,sans-serif;font-size:13px;font-weight:700;color:var(--p);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.cap span{color:var(--mut);font-weight:600}
.it{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;margin-bottom:6px}
.it.z{opacity:.72}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.it .nm small{color:var(--mut);font-size:12px}
.it .nm i{display:block;color:var(--mut);font-size:12px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{width:56px;height:52px;border:0;border-radius:12px;font-size:26px;font-weight:700;cursor:pointer;user-select:none;touch-action:manipulation}
.cnt.m{background:var(--line);color:var(--ink);width:46px}
.cnt.p{background:var(--p);color:#fff}
.cnt:active{transform:scale(.94)}
.val{min-width:54px;text-align:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;border:0;background:none;cursor:pointer;padding:0}
.val.ro{cursor:default;color:var(--p)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);border-color:transparent}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ft{position:relative;border-radius:12px;overflow:hidden;background:var(--line);aspect-ratio:4/3}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.ft p{position:absolute;left:0;right:0;bottom:0;margin:0;padding:4px 8px;font-size:12px;background:#000a;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.bar .btn{flex:1;max-width:360px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--p);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px}
.tot b{font-size:30px;font-family:"Exo 2",system-ui,sans-serif}
.mask{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.mask{align-items:center}.dlg{border-radius:18px}}
.dlg h2{margin:0 0 6px;font-size:20px;font-family:"Exo 2",system-ui,sans-serif;font-weight:700}
.dlg .row{margin-top:14px}
.cat{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto;margin-top:8px}
.cat label{display:flex;gap:10px;align-items:center;margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:500;font-size:15px}
.cat input{width:22px;height:22px;flex:none}
.cat h4{margin:8px 2px 0;font-size:12px;color:var(--p);text-transform:uppercase}
.btn.rec{background:var(--p);color:#fff;border-color:var(--p);animation:pul 1.2s infinite}@keyframes pul{50%{opacity:.75}}@media(prefers-reduced-motion:reduce){.btn.rec{animation:none}}
audio{max-width:100%}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--p);font-weight:700;cursor:pointer}
.mut{color:var(--mut);font-size:13px}
.srch{margin-bottom:8px}
.big{width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:#000}
.hide{display:none!important}
.sw{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.sw input{width:22px;height:22px}
</style>

/* ---------- Almacenamiento (IndexedDB) ---------- */
let db;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("soltec_conteo",2);r.onupgradeneeded=()=>{const d=r.result;for(const n of ["jobs","fotos","audios"])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"});if(!d.objectStoreNames.contains("cfg"))d.createObjectStore("cfg")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(s,m,fn)=>new Promise((res,rej)=>{const t=db.transaction(s,m);const st=t.objectStore(s);const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)});
const all=s=>tx(s,"readonly",st=>st.getAll());
const get=(s,k)=>tx(s,"readonly",st=>st.get(k));
const put=(s,v,k)=>tx(s,"readwrite",st=>k===undefined?st.put(v):st.put(v,k));
const del=(s,k)=>tx(s,"readwrite",st=>st.delete(k));

/* ---------- Utilidades UI ---------- */
function toast(msg,undoFn){document.querySelectorAll(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.innerHTML=esc(msg)+(undoFn?' <button>Deshacer</button>':"");document.body.appendChild(t);if(undoFn)t.querySelector("button").onclick=()=>{undoFn();t.remove()};setTimeout(()=>t.remove(),undoFn?5000:2200)}
function modal(html,onMount,fija){const m=document.createElement("div");m.className="mask";m.innerHTML='<div class="dlg">'+html+'</div>';document.body.appendChild(m);m.addEventListener("click",e=>{if(e.target===m&&!fija)m.remove()});const close=()=>m.remove();onMount&&onMount(m.querySelector(".dlg"),close);return close}

/* Comprimir imagen */
function comprime(file,max=1400,q=.72,tipo="image/jpeg"){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");if(tipo==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);res({data:c.toDataURL(tipo,q),w,h})};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ---------- Pantalla: lista de trabajos ---------- */
async function inicio(){
  job=null;jobs=(await all("jobs")).sort((a,b)=>b.mod-a.mod);
  $("#back").classList.add("hide");$("#tabs").classList.add("hide");
  $("#htitle").innerHTML="Conteo de obra<small>"+esc(CFG.empresa||CFG.comercial||"SOLTEC")+"</small>";
  const q=filtro.toLowerCase();
  const lista=jobs.filter(j=>!q||(j.nombre+" "+j.cliente+" "+j.direccion).toLowerCase().includes(q));
  $("#main").innerHTML=(jobs.length>3?`<input class="srch" id="srch" placeholder="Buscar obra, cliente o dirección" value="${esc(filtro)}">`:"")+

const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const dur=x=>{x=Math.round(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")};
const capi=t=>t?t.charAt(0).toUpperCase()+t.slice(1):t;
let dictando=null;
/* Escucha frase a frase (en Android el modo continuo repite frases) y quita repeticiones */
function escucha({onTexto,onError,onFin}){
  let activo=true,commit="",sesion="",r=null,acabado=false;
  const une=(a,b)=>!a?b:!b?a:a+" "+b;
  const norm=t=>t.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,"").replace(/\s+/g," ").trim();
  const limpia=arr=>{const out=[];for(let t of arr){t=String(t||"").trim();if(!t)continue;const l=out[out.length-1];if(l&&norm(t).startsWith(norm(l)))out[out.length-1]=t;else if(l&&norm(l).startsWith(norm(t)))continue;else out.push(t)}return out.join(" ")};
  const sinEco=(c,n)=>{if(!c||!n)return n;const nc=norm(c),nn=norm(n);if(nc.endsWith(nn))return "";if(nn.startsWith(nc))return n.trim().slice(Math.min(n.trim().length,c.length)).trim();const cw=nc.split(" "),nw=n.trim().split(/\s+/),nwn=nn.split(" ");for(let k=Math.min(8,cw.length,nwn.length);k>=2;k--){if(cw.slice(-k).join(" ")===nwn.slice(0,k).join(" "))return nw.slice(k).join(" ")}return n};
  const termina=()=>{if(acabado)return;acabado=true;onFin&&onFin(capi(commit))};
  const nueva=()=>{r=new SRec();r.lang="es-ES";r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
    r.onresult=e=>{sesion=sinEco(commit,limpia(Array.from(e.results).map(x=>x[0].transcript)));onTexto&&onTexto(capi(une(commit,sesion)))};
    r.onerror=e=>{if(e.error==="no-speech"||e.error==="aborted")return;activo=false;onError&&onError(e.error)};
    r.onend=()=>{commit=une(commit,sesion);sesion="";if(activo){try{nueva()}catch(x){activo=false;termina()}}else termina()};
    r.start()};
  nueva();
  return {stop(){activo=false;try{r.stop()}catch(e){termina()}}};
}
function dictar(target,btn,onDone){
  if(dictando){dictando.stop();return}
  if(!SRec||!window.isSecureContext){ayudaVoz(target);return}
  const lbl=btn.textContent,base=target.value.replace(/\s*$/,"");
  const pon=t=>{if(t)target.value=base?base+(/[.!?:]$/.test(base)?" ":". ")+t:t};
  try{dictando=escucha({onTexto:pon,
    onError:err=>toast(err==="not-allowed"||err==="service-not-allowed"?"Permite el micrófono para dictar":err==="network"?"El dictado necesita conexión a internet":"Dictado detenido"),
    onFin:t=>{pon(t);dictando=null;btn.textContent=lbl;btn.classList.remove("rec");onDone&&onDone(target.value)}});
    btn.textContent="■ Parar dictado";btn.classList.add("rec")}catch(e){dictando=null;toast("No se pudo iniciar el dictado")}
}

function grabadoraMovil(motivo){
  modal(`<h2>Grabar nota de voz</h2><p>${esc(motivo||"Abierta como archivo en el móvil, Chrome no deja usar el micrófono dentro de la app.")}</p>
  <p>Pulsa el botón para grabar con la <b>grabadora del móvil</b>. Al terminar, la nota se guarda en esta obra.</p>

  /* Pie */
  const n=d.getNumberOfPages();
  for(let i=1;i<=n;i++){d.setPage(i);d.setFillColor(...C);d.rect(M,286.6,18,.8,"F");d.setDrawColor(228,228,231);d.setLineWidth(.3);d.line(M+18,287,W-M,287);d.setFont("helvetica","normal");d.setFontSize(7.5);d.setTextColor(120,128,142);
    if(CFG.pie)d.text(d.splitTextToSize(CFG.pie,W-2*M-30)[0],M,291);d.text(`Pág. ${i}/${n}`,W-M,291,{align:"right"})}
  const nombre=("Conteo_"+(job.nombre||"obra")+"_"+(job.fecha||hoy())).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w-]+/g,"_").slice(0,80)+".pdf";
  const blob=d.output("blob");const file=new File([blob],nombre,{type:"application/pdf"});
  const texto=`Informe de conteo de obra: ${job.nombre}${job.cliente?" ("+job.cliente+")":""} · ${CFG.comercial}`;
  let files=[file];
  if(conAudios){
    const base=nombre.replace(/^Conteo_/,"").replace(/\.pdf$/,"");
    const auds=(await Promise.all((job.audios||[]).map(id=>get("audios",id)))).filter(a=>a&&a.blob);
    files=files.concat(auds.map(a=>{const m=(a.blob.type||a.mime||"audio/webm").split(";")[0];const ext=/mp4|m4a|aac/.test(m)?"m4a":/ogg/.test(m)?"ogg":/mpeg|mp3/.test(m)?"mp3":/wav/.test(m)?"wav":"webm";return new File([a.blob],`Nota_voz_${job.audios.indexOf(a.id)+1}_${base}.${ext}`.slice(0,90),{type:m})}));
  }
  const puede=fs=>{try{return !!(navigator.canShare&&navigator.canShare({files:fs}))}catch(e){return false}};
  if(compartir&&puede(files)){
    try{await navigator.share({files,title:"Informe de conteo · "+job.nombre,text:texto+(files.length>1?` · ${files.length-1} nota${files.length>2?"s":""} de voz`:"")})}catch(e){if(e.name!=="AbortError")files.forEach(f=>descarga(f,f.name))}
  }else if(compartir&&conAudios&&puede([file])){
    toast("Este móvil no deja enviar los audios: se comparte el PDF y se descargan los audios");
    files.slice(1).forEach(f=>descarga(f,f.name));
    try{await navigator.share({files:[file],title:"Informe de conteo · "+job.nombre,text:texto})}catch(e){}
  }else{if(compartir)toast("Este navegador no permite compartir archivos; se descargan");files.forEach(f=>descarga(f,f.name))}
}
function descarga(blob,nombre){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}

/* ---------- Ajustes ---------- */
function ajustes(){
  const F=[["empresa","Razón social"],["comercial","Nombre comercial"],["cif","CIF"],["dir","Dirección"],["loc","Localidad"],["tel","Teléfono"],["email","Correo electrónico"],["web","Web"],["tecnico","Técnico por defecto"]];
  modal(`<h2>Ajustes · imagen corporativa</h2>
  <label>Logotipo</label><div class="row" style="align-items:center"><div style="flex:0 0 96px;height:60px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff">${CFG.logo?`<img src="${CFG.logo}" style="max-width:90px;max-height:54px">`:'<span class="mut">Sin logo</span>'}</div><button class="btn sec" id="lg">Elegir imagen</button>${CFG.logo!==LOGO_SOLTEC?'<button class="btn sec" id="lgx">Logo SOLTEC</button>':""}</div>
  <label>Color corporativo</label><div class="row" style="align-items:center"><input type="color" id="cl" value="${CFG.color}" style="height:48px;padding:4px"><button class="btn sec" id="clr" type="button">Rojo SOLTEC</button></div>
  ${F.map(([k,l])=>`<label>${l}</label><input data-c="${k}" value="${esc(CFG[k])}">`).join("")}
  <label>Texto al pie del informe</label><textarea data-c="pie" style="min-height:70px">${esc(CFG.pie)}</textarea>
  ${!instalada()&&location.protocol.startsWith("http")?'<label>App</label><button class="btn sec w" id="inst2">Instalar en el móvil</button>':""}
  <label>Copia de seguridad</label><div class="row"><button class="btn sec" id="exp">Exportar datos</button><button class="btn sec" id="imp">Importar</button></div>
  <div class="row"><button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>
  <p class="mut" style="text-align:center;margin-top:12px">SOLTEC · Conteo de obra · versión ${VERSION}</p>${location.protocol.startsWith("http")?'<button class="btn sec w" id="upd">Buscar actualización</button>':""}`,(d,c)=>{
    d.querySelector("[data-x]").onclick=c;
    d.querySelector("#lg").onclick=()=>{c();$("#logoIn").click()};
    const lx=d.querySelector("#lgx");if(lx)lx.onclick=async()=>{CFG.logo=LOGO_SOLTEC;await put("cfg",CFG,"cfg");aplicaColor();c();ajustes()};
    const up=d.querySelector("#upd");if(up)up.onclick=()=>{c();buscaVersion()};const i2=d.querySelector("#inst2");if(i2)i2.onclick=()=>{c();instalar()};d.querySelector("#clr").onclick=()=>d.querySelector("#cl").value="#de0023";d.querySelector("#exp").onclick=exportar;d.querySelector("#imp").onclick=()=>$("#impIn").click();
    d.querySelector("[data-ok]").onclick=async()=>{d.querySelectorAll("[data-c]").forEach(i=>CFG[i.dataset.c]=i.value.trim());CFG.color=d.querySelector("#cl").value;await put("cfg",CFG,"cfg");aplicaColor();c();job?pintaTrabajo():inicio();toast("Ajustes guardados")};
  });
}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r("");f.readAsDataURL(b)});
const d2b=u=>{const[h,b]=u.split(",");const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/:(.*?);/)||[])[1]||"audio/webm"})};
async function exportar(){const audios=await Promise.all((await all("audios")).map(async a=>{const{blob,...r}=a;return{...r,data:blob?await b2d(blob):""}}));const data={app:"soltec-conteo",v:2,fecha:new Date().toISOString(),cfg:CFG,jobs:await all("jobs"),fotos:await all("fotos"),audios};descarga(new Blob([JSON.stringify(data)],{type:"application/json"}),"soltec-conteo-copia-"+hoy()+".json")}
async function importar(file){try{const data=JSON.parse(await file.text());if(data.app!=="soltec-conteo")throw 0;for(const f of data.fotos||[])await put("fotos",f);for(const a of data.audios||[]){const{data:u,...r}=a;if(u)r.blob=d2b(u);await put("audios",r)}for(const j of data.jobs||[])await put("jobs",j);if(data.cfg){CFG={...CFG,...data.cfg};await put("cfg",CFG,"cfg");aplicaColor()}document.querySelectorAll(".mask").forEach(m=>m.remove());toast((data.jobs||[]).length+" trabajos importados");inicio()}catch(e){toast("Archivo de copia no válido")}}

/* ---------- Instalación (PWA) ---------- */
let pideInstalar=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();pideInstalar=e});
window.addEventListener("appinstalled",()=>{pideInstalar=null;toast("App instalada");if(!job)inicio()});
const esIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const instalada=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
async function instalar(){
  if(pideInstalar){pideInstalar.prompt();const r=await pideInstalar.userChoice;pideInstalar=null;if(r.outcome==="accepted")toast("Instalando…");return}
  const ios=esIOS();
  modal(`<h2>Instalar en el móvil</h2>${ios?`<p>En iPhone o iPad, desde <b>Safari</b>:</p><ol style="padding-left:20px;line-height:1.7"><li>Pulsa el botón <b>Compartir</b> (cuadrado con flecha hacia arriba).</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li><li>Pulsa <b>Añadir</b>.</li></ol>`:`<p>En Android, desde <b>Chrome</b>:</p><ol style="padding-left:20px;line-height:1.7"><li>Pulsa el menú <b>⋮</b> arriba a la derecha.</li><li>Elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</li><li>Confirma con <b>Instalar</b>.</li></ol>`}<p class="mut">Aparecerá el icono de SOLTEC y la app se abrirá a pantalla completa, también sin conexión.</p><button class="btn w" data-x>Entendido</button>`,(d,c)=>d.querySelector("[data-x]").onclick=c);
}
let regSW=null;
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  const habia=!!navigator.serviceWorker.controller;let recargado=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(habia&&!recargado){recargado=true;location.reload()}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{regSW=r;r.update().catch(()=>{})}).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&regSW)regSW.update().catch(()=>{})});
}
async function buscaVersion(){if(!regSW){location.reload();return}toast("Buscando versión nueva…");try{await regSW.update()}catch(e){}setTimeout(()=>location.reload(),1500)}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- Eventos ---------- */
$("#back").onclick=inicio;$("#cfgBtn").onclick=ajustes;
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;pintaTrabajo();scrollTo(0,0)});
$("#fotoIn").onchange=e=>{addFotos([...e.target.files]);e.target.value=""};
$("#galIn").onchange=e=>{addFotos([...e.target.files]);e.target.value=""};
$("#logoIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=await comprime(f,500,.92,"image/png");CFG.logo=r.data;await put("cfg",CFG,"cfg");aplicaColor();ajustes()};
$("#audIn").onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length&&job)addAudios(f)};
$("#impIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importar(f)};

(async()=>{try{db=await idb();const c=await get("cfg","cfg");if(c){const v2=c.v>=2;CFG={...CFG,...c};if(!v2){CFG.color="#de0023";if(!c.logo)CFG.logo=LOGO_SOLTEC;CFG.v=2;await put("cfg",CFG,"cfg")}}}catch(e){$("#main").innerHTML='<div class="empty">Este navegador no permite guardar datos (modo privado). Ábrela en Chrome normal.</div>';return}aplicaColor();inicio()})();
}
</script>
