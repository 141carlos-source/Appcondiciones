<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Formularios de cliente</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#15213a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:660px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #dce4ee;border-radius:18px;padding:16px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{max-width:110px;max-height:52px;object-fit:contain}.brand strong{font-size:17px}h1{font-size:22px;margin:0 0 5px}h2{font-size:16px;margin:0 0 12px}.small{font-size:11px;color:#7a8797;line-height:1.45}.note{background:#eef7ff;border:1px solid #b8d7ff;color:#0b4c9c;border-radius:13px;padding:11px;font-weight:800;font-size:12px;line-height:1.45;margin-bottom:12px}.privacy{background:#eaf8ef;border:1px solid #9bd3ad;color:#176b35;border-radius:13px;padding:11px;font-weight:800;font-size:12px;line-height:1.45;margin-bottom:12px}.field{display:block;font-size:12px;font-weight:700;color:#65728a;margin:11px 0}input[type=text],input[type=email],input[type=tel],select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #cdd7e4;border-radius:11px;font-size:16px;background:#fff;color:#15213a}input[data-upper="1"]{text-transform:uppercase}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ee{border-left:5px solid #1565ff;padding-left:10px}.gg{border-left:5px solid #f4b400;padding-left:10px}.optional{font-size:10px;color:#8390a4;font-weight:600}.legal{font-size:11px;line-height:1.55;color:#5d687a}.consent{display:flex!important;align-items:flex-start!important;gap:10px;color:#26334a!important;line-height:1.45!important;margin:0!important}.consent input{width:22px;height:22px;flex:0 0 auto;margin:0}canvas{width:100%;height:190px;border:1px solid #aeb9c7;border-radius:12px;background:#fff;touch-action:none;display:block}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#0b5ed7;color:#fff;font-weight:900;font-size:16px}.secondary{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;color:#27364f;font-weight:800}.error{display:none;margin-bottom:10px;padding:10px;border-radius:10px;background:#fff0f0;border:1px solid #efb6b6;color:#a51d1d;font-size:12px;font-weight:800}.error.show{display:block}.success{text-align:center}.success h2{color:#16724a}.warn{background:#fff8db;border:1px solid #ead58b;color:#705700;border-radius:12px;padding:10px;font-size:11px;font-weight:700;line-height:1.45;margin-bottom:12px}.active{background:#ecfff5;border-color:#9bdab9}.active h1{color:#137a4a}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
</style></head><body><main id="app"><div class="card"><h2>Cargando formulario…</h2></div></main>
<script>
const LINK2='APP_AVISOS_FORM_LINK_V2',LINK1='APP_AVISOS_FORM_LINK_V1',RESP2='APP_AVISOS_FORM_RESPONSE_V2',RESP1='APP_AVISOS_FORM_RESPONSE_V1';
const F=[['cliente','NOMBRE / RAZÓN SOCIAL','P'],['contacto','NOMBRE PERSONA DE CONTACTO','P'],['nif','DNI / NIF / CIF','P'],['telefono','TELÉFONO','P'],['email','CORREO ELECTRÓNICO','P'],['iban','IBAN','P'],['direccion','DIRECCIÓN DEL SUMINISTRO','S'],['cp','CÓDIGO POSTAL','S'],['localidad','LOCALIDAD','S'],['provincia','PROVINCIA','S'],['refCatastral','REFERENCIA CATASTRAL','S'],['cupsE','CUPS ELECTRICIDAD','S'],['cupsG','CUPS GAS','S'],['tension','TENSIÓN','S'],['potencia','POTENCIAS A CONTRATAR POR PERIODO','S'],['tarifa','TARIFA ELÉCTRICA','S']];
const N230=['0,345','0,690','0,805','1,150','1,725','2,300','3,450','4,600','5,750','6,900','8,050','9,200','10,350','11,500','14,490'];
const N400=['1,039','2,078','2,425','3,464','5,196','6,928','10,392','13,856','17,321','20,785','24,249','27,713','31,177','34,641','43,648'];
let payload=null,firmado=false,respuestaFinal=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),may=s=>String(s??'').toLocaleUpperCase('es-ES');
const num=v=>{const n=parseFloat(String(v||'').replace(',','.').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:null};
const fmt=n=>String(Math.round(Number(n)*1000)/1000).replace('.',',');
function lista01(){const a=[];for(let i=1;i<=150;i++)a.push((i/10).toFixed(1).replace('.',','));return a}
function listaPot(t,tar){if(tar!=='3.0 TD')return lista01();const norm=String(t||'').includes('400')?N400:N230;return [...new Set([...lista01(),...norm])].sort((a,b)=>(num(a)||0)-(num(b)||0))}
function optsP(t,tar,actual=''){const vals=listaPot(t,tar),cur=String(actual||'');let h='<option value="">SELECCIONAR…</option>'+vals.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v} kW</option>`).join('');if(cur&&!vals.includes(cur))h+=`<option value="${esc(cur)}" selected>${esc(cur)} kW · VALOR GUARDADO</option>`;return h}
function dec(t){let b=String(t||'').replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const x=atob(b),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}
function tpl(t,v){return String(t||'').replace(/\{([A-ZÁÉÍÓÚÑ_]+)\}/g,(m,k)=>v[k]??m)}
function iban(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/(.{4})/g,'$1 ').trim()}
function error(t){const z=document.getElementById('err');if(z){z.textContent=t;z.classList.add('show');scrollTo({top:0,behavior:'smooth'})}}
function firma(){const c=document.getElementById('sig');if(!c)return;firmado=false;const d=Math.max(1,Math.min(3,devicePixelRatio||1)),r=c.getBoundingClientRect(),w=Math.max(280,Math.round(r.width||560)),h=190;c.width=Math.round(w*d);c.height=Math.round(h*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.fillStyle='#fff';x.fillRect(0,0,w,h);x.strokeStyle='#172033';x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';let p=false;const pt=e=>{const q=c.getBoundingClientRect();return{x:(e.clientX-q.left)*(w/q.width),y:(e.clientY-q.top)*(h/q.height)}};c.onpointerdown=e=>{e.preventDefault();p=true;firmado=true;const q=pt(e);x.beginPath();x.moveTo(q.x,q.y);try{c.setPointerCapture(e.pointerId)}catch(_){}};c.onpointermove=e=>{if(!p)return;e.preventDefault();const q=pt(e);x.lineTo(q.x,q.y);x.stroke()};const up=e=>{p=false;try{c.releasePointerCapture(e.pointerId)}catch(_){}};c.onpointerup=up;c.onpointercancel=up}
function landing(){document.getElementById('app').innerHTML='<div class="card active"><h1>FORMULARIOS DE CLIENTE</h1><p><strong>Esta dirección está activa.</strong></p><p>Para completar un formulario, abre el enlace que te haya enviado la empresa.</p></div>'}
function renderPotencias(inicial=false){const box=document.getElementById('powerPeriods');if(!box)return;const t=document.querySelector('[data-k="tension"]')?.value||'230 V MONOFÁSICA',tar=document.querySelector('[data-k="tarifa"]')?.value||'2.0 TD',n=tar==='3.0 TD'?6:2,old={};box.querySelectorAll('[data-k^="potenciaP"]').forEach(x=>old[x.dataset.k]=x.value);box.innerHTML='';for(let i=1;i<=n;i++){const lab=document.createElement('label');lab.className='field';lab.textContent=`P${i} (kW)`;const sel=document.createElement('select');sel.dataset.k='potenciaP'+i;const original=inicial?(payload?.original?.['potenciaP'+i]||''):(old['potenciaP'+i]||'');sel.innerHTML=optsP(t,tar,original);sel.value=original;lab.appendChild(sel);box.appendChild(lab)}const h=document.getElementById('powerHelp');if(h)h.textContent=tar==='3.0 TD'?'P1 ≤ P2 ≤ P3 ≤ P4 ≤ P5 ≤ P6; alguna potencia debe superar 15 kW.':'P1 y P2; ambas potencias deben ser ≤ 15 kW.'}
function render(){const h=location.hash;if(!h.startsWith('#form=')){landing();return}payload=dec(h.slice(6));const v2=payload._type===LINK2,v1=payload._type===LINK1;if(!v2&&!v1)throw Error('FORMULARIO NO VÁLIDO');if(v2&&!payload.sessionToken)throw Error('IDENTIFICADOR DE FORMULARIO NO VÁLIDO');if(payload.expiresAt&&new Date(payload.expiresAt)<new Date())throw Error('ESTE ENLACE HA CADUCADO');const b=payload.brand||{},f=payload.form||{},o=v2?{}:(payload.original||{}),defs=(f.fields||[]).map(k=>F.find(x=>x[0]===k)).filter(Boolean),vars={EMPRESA:may(b.empresa||'EMPRESA'),CLIENTE:v2?'CLIENTE':may(o.cliente||'CLIENTE'),AVISO:may(payload.notice?.code||'AVISO'),FORMULARIO:may(f.name||'FORMULARIO'),ENLACE:location.href,CADUCIDAD:payload.expiresAt?new Date(payload.expiresAt).toLocaleString('es-ES'):''};const inp=x=>{const[k,l]=x,cl=k==='cupsE'?'ee':k==='cupsG'?'gg':'',val=o[k]||'';if(k==='tension')return `<label class="field ${cl}">${esc(l)} <span class="optional">(OPCIONAL)</span><select data-k="tension" onchange="renderPotencias()"><option value="">SELECCIONAR…</option><option value="230 V MONOFÁSICA" ${String(val).includes('230')?'selected':''}>230 V MONOFÁSICA</option><option value="400 V TRIFÁSICA" ${String(val).includes('400')?'selected':''}>400 V TRIFÁSICA</option></select></label>`;if(k==='potencia')return `<div class="field"><strong>${esc(l)}</strong> <span class="optional">(OPCIONAL)</span><div id="powerPeriods" class="grid2"></div><div id="powerHelp" class="small"></div></div>`;if(k==='tarifa')return `<label class="field ${cl}">${esc(l)} <span class="optional">(OPCIONAL)</span><select data-k="tarifa" onchange="renderPotencias()"><option value="">SELECCIONAR…</option><option value="2.0 TD" ${val==='2.0 TD'?'selected':''}>2.0 TD · ≤ 15 kW EN TODOS LOS PERIODOS</option><option value="3.0 TD" ${val==='3.0 TD'?'selected':''}>3.0 TD · > 15 kW EN ALGÚN PERIODO</option></select></label>`;const t=k==='email'?'email':k==='telefono'?'tel':'text';return `<label class="field ${cl}">${esc(l)} <span class="optional">(OPCIONAL)</span><input type="${t}" data-k="${k}" data-upper="${k==='email'?'0':'1'}" value="${esc(val)}"></label>`},blo=(tit,g)=>{const a=defs.filter(x=>x[2]===g);return a.length?`<div class="card"><h2>${tit}</h2>${a.map(inp).join('')}</div>`:''},legal=f.showLegal?`<div class="card legal"><h2>INFORMACIÓN</h2><p>${esc(tpl(f.legalText||'',vars))}</p></div>`:'',cons=f.consentEnabled?`<div class="card"><label class="consent"><input id="cons" type="checkbox"><span>${esc(tpl(f.consentText||'',vars))}${f.consentRequired?' <strong>(OBLIGATORIO)</strong>':' <span class="optional">(OPCIONAL)</span>'}</span></label></div>`:'',sig=f.signatureRequired?`<div class="card"><h2>FIRMA DEL CLIENTE</h2><canvas id="sig"></canvas><div class="row"><button class="secondary" onclick="firma()">BORRAR FIRMA</button></div><p class="small">FIRMA CON EL DEDO EN EL RECUADRO.</p></div>`:'';document.getElementById('app').innerHTML=`<div id="err" class="error"></div>${v2?'<div class="privacy">PRIVACIDAD: este enlace no contiene los datos personales que la empresa ya tiene. Completa solo los campos que quieras facilitar o corregir.</div>':''}<div class="warn">Este formulario se procesa en tu navegador. Al finalizar se generará un archivo de respuesta para reenviar manualmente a la empresa.</div><div class="card brand">${b.logo?`<img src="${b.logo}" alt="Logo">`:''}<div><strong>${esc(b.empresa||'')}</strong><div class="small">${esc(b.telefono||'')} ${b.email?'· '+esc(b.email):''}</div></div></div><div class="card"><h1>${esc(f.name||'FORMULARIO')}</h1><div class="small">${esc(payload.notice?.code||'')} · FORMULARIO DEL CLIENTE</div></div><div class="note">${esc(tpl(f.intro||'',vars))}</div>${blo('DATOS PERSONALES Y CONTACTO','P')}${blo('SUMINISTRO','S')}${legal}${cons}${sig}<div class="card"><button class="btn" onclick="preparar()">PREPARAR RESPUESTA</button></div>`;document.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{if(i.dataset.upper==='1'){const p=i.selectionStart;i.value=may(i.value);try{i.setSelectionRange(p,p)}catch(_){}}});setTimeout(()=>renderPotencias(true),20);if(f.signatureRequired)setTimeout(firma,60)}
function preparar(){document.getElementById('err')?.classList.remove('show');const f=payload.form||{},v2=payload._type===LINK2,r={cliente:'',contacto:'',nif:'',telefono:'',email:'',iban:'',direccion:'',cp:'',localidad:'',provincia:'',refCatastral:'',cupsE:'',cupsG:'',tension:'',potencia:'',potenciaP1:'',potenciaP2:'',potenciaP3:'',potenciaP4:'',potenciaP5:'',potenciaP6:'',tarifa:''};let em=null;document.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k;let v=String(i.value||'').trim();if(k==='email'){if(v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))em=i}else v=may(v);if(k==='iban')v=iban(v);r[k]=v});if(em){error('REVISA EL CORREO ELECTRÓNICO');em.focus();return}const tar=r.tarifa||'',n=tar==='3.0 TD'?6:2,pp=[];for(let i=1;i<=n;i++)pp.push(num(r['potenciaP'+i]));const algun=Object.keys(r).some(k=>/^potenciaP[1-6]$/.test(k)&&String(r[k]||'').trim());if(algun&&pp.some(x=>x===null)){error('COMPLETA TODAS LAS POTENCIAS DEL PERIODO SELECCIONADO');return}if(tar==='2.0 TD'&&pp.some(x=>x!==null&&x>15)){error('2.0 TD NO PUEDE SUPERAR 15 kW EN NINGÚN PERIODO');return}if(tar==='3.0 TD'&&algun){if(!pp.some(x=>x>15)){error('3.0 TD REQUIERE MÁS DE 15 kW EN AL MENOS UN PERIODO');return}for(let i=1;i<pp.length;i++)if(pp[i]<pp[i-1]){error(`EN 3.0 TD, P${i+1} DEBE SER MAYOR O IGUAL QUE P${i}`);return}}const pv=pp.filter(x=>x!==null);r.potencia=pv.length?fmt(Math.max(...pv)):'';if(f.consentEnabled&&f.consentRequired&&!document.getElementById('cons')?.checked){error('DEBES MARCAR EL CONSENTIMIENTO');return}if(f.signatureRequired&&!firmado){error('LA FIRMA ES OBLIGATORIA');return}const now=new Date().toISOString(),c=document.getElementById('sig');respuestaFinal={_type:v2?RESP2:RESP1,version:v2?2:1,notice:payload.notice,sessionToken:v2?(payload.sessionToken||''):'',form:{id:f.id,name:f.name},response:r,signature:f.signatureRequired&&c?c.toDataURL('image/png'):'',consent:{shown:!!f.consentEnabled,accepted:!!document.getElementById('cons')?.checked,text:f.consentText||'',at:now},submittedAt:now};if(!v2)respuestaFinal.original=payload.original||{};document.getElementById('app').innerHTML=`<div class="card success"><h2>RESPUESTA PREPARADA</h2><p>${esc(f.successText||'FORMULARIO COMPLETADO.')}</p><p class="small">ENVÍA EL ARCHIVO DE RESPUESTA A LA EMPRESA POR WHATSAPP O CORREO.</p><button class="btn" onclick="compartir()">COMPARTIR RESPUESTA</button><button class="secondary" style="width:100%;margin-top:9px" onclick="descargar()">DESCARGAR RESPUESTA</button></div>`}
function nombre(){const s=x=>may(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');return `RESPUESTA_${s(respuestaFinal.notice?.code||'AVISO')}_${s(respuestaFinal.form?.name||'FORMULARIO')}.json`}
function archivo(){return new File([JSON.stringify(respuestaFinal,null,2)],nombre(),{type:'application/json'})}
function descargar(){const f=archivo(),u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function compartir(){const f=archivo();try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({title:'RESPUESTA '+(respuestaFinal.notice?.code||''),text:'Reenvía este archivo de respuesta a la empresa.',files:[f]});return}}catch(e){if(e?.name==='AbortError')return}descargar()}
try{render()}catch(e){document.getElementById('app').innerHTML=`<div class="card"><h2>NO SE PUDO ABRIR EL FORMULARIO</h2><p>${esc(e.message||'ENLACE NO VÁLIDO')}</p></div>`}
</script></body></html>
