<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Formulario del cliente</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#15213a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:660px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #dce4ee;border-radius:18px;padding:16px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{max-width:110px;max-height:52px;object-fit:contain}.brand strong{font-size:17px}h1{font-size:22px;margin:0 0 5px}h2{font-size:16px;margin:0 0 12px}.small{font-size:11px;color:#7a8797;line-height:1.45}.note{background:#eef7ff;border:1px solid #b8d7ff;color:#0b4c9c;border-radius:13px;padding:11px;font-weight:800;font-size:12px;line-height:1.45;margin-bottom:12px}label.field{display:block;font-size:12px;font-weight:700;color:#65728a;margin:11px 0}input[type=text],input[type=email],input[type=tel]{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #cdd7e4;border-radius:11px;font-size:16px;background:#fff;color:#15213a}input[data-upper="1"]{text-transform:uppercase}.ee{border-left:5px solid #1565ff;padding-left:10px}.gg{border-left:5px solid #f4b400;padding-left:10px}.optional{font-size:10px;color:#8390a4;font-weight:600}.legal{font-size:11px;line-height:1.55;color:#5d687a}.consent{display:flex!important;align-items:flex-start!important;gap:10px;color:#26334a!important;line-height:1.45!important;margin:0!important}.consent input{width:22px;height:22px;flex:0 0 auto;margin:0}canvas{width:100%;height:190px;border:1px solid #aeb9c7;border-radius:12px;background:#fff;touch-action:none;display:block}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#0b5ed7;color:#fff;font-weight:900;font-size:16px}.secondary{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;color:#27364f;font-weight:800}.error{display:none;margin-bottom:10px;padding:10px;border-radius:10px;background:#fff0f0;border:1px solid #efb6b6;color:#a51d1d;font-size:12px;font-weight:800}.error.show{display:block}.success{text-align:center}.success h2{color:#16724a}.warn{background:#fff8db;border:1px solid #ead58b;color:#705700;border-radius:12px;padding:10px;font-size:11px;font-weight:700;line-height:1.45;margin-bottom:12px}</style></head><body><main id="app"><div class="card"><h2>Cargando formulario…</h2></div></main><script>
const LINK='APP_AVISOS_FORM_LINK_V1',RESP='APP_AVISOS_FORM_RESPONSE_V1';
const F=[['cliente','NOMBRE / RAZÓN SOCIAL','P'],['contacto','NOMBRE PERSONA DE CONTACTO','P'],['nif','DNI / NIF / CIF','P'],['telefono','TELÉFONO','P'],['email','CORREO ELECTRÓNICO','P'],['iban','IBAN','P'],['direccion','DIRECCIÓN DEL SUMINISTRO','S'],['cp','CÓDIGO POSTAL','S'],['localidad','LOCALIDAD','S'],['provincia','PROVINCIA','S'],['refCatastral','REFERENCIA CATASTRAL','S'],['cupsE','CUPS ELECTRICIDAD','S'],['cupsG','CUPS GAS','S']];
let payload=null,firmado=false,respuestaFinal=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),may=s=>String(s??'').toUpperCase();
function dec(t){let b=String(t||'').replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const x=atob(b),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}
function tpl(t,v){return String(t||'').replace(/\{([A-ZÁÉÍÓÚÑ_]+)\}/g,(m,k)=>v[k]??m)}
function iban(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/(.{4})/g,'$1 ').trim()}
function error(t){const z=document.getElementById('err');if(z){z.textContent=t;z.classList.add('show');scrollTo({top:0,behavior:'smooth'})}}
function firma(){const c=document.getElementById('sig');if(!c)return;firmado=false;const d=Math.max(1,Math.min(3,devicePixelRatio||1)),r=c.getBoundingClientRect(),w=Math.max(280,Math.round(r.width||560)),h=190;c.width=Math.round(w*d);c.height=Math.round(h*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.fillStyle='#fff';x.fillRect(0,0,w,h);x.strokeStyle='#172033';x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';let p=false;const pt=e=>{const q=c.getBoundingClientRect();return{x:(e.clientX-q.left)*(w/q.width),y:(e.clientY-q.top)*(h/q.height)}};c.onpointerdown=e=>{e.preventDefault();p=true;firmado=true;const q=pt(e);x.beginPath();x.moveTo(q.x,q.y);try{c.setPointerCapture(e.pointerId)}catch(_){}};c.onpointermove=e=>{if(!p)return;e.preventDefault();const q=pt(e);x.lineTo(q.x,q.y);x.stroke()};const up=e=>{p=false;try{c.releasePointerCapture(e.pointerId)}catch(_){}};c.onpointerup=up;c.onpointercancel=up}
function render(){const h=location.hash;if(!h.startsWith('#form='))throw Error('ENLACE DE FORMULARIO NO VÁLIDO');payload=dec(h.slice(6));if(payload._type!==LINK)throw Error('FORMULARIO NO VÁLIDO');if(payload.expiresAt&&new Date(payload.expiresAt)<new Date())throw Error('ESTE ENLACE HA CADUCADO');const b=payload.brand||{},f=payload.form||{},o=payload.original||{},defs=(f.fields||[]).map(k=>F.find(x=>x[0]===k)).filter(Boolean),vars={EMPRESA:may(b.empresa||'EMPRESA'),CLIENTE:may(o.cliente||'CLIENTE'),AVISO:may(payload.notice?.code||'AVISO'),FORMULARIO:may(f.name||'FORMULARIO'),ENLACE:location.href,CADUCIDAD:payload.expiresAt?new Date(payload.expiresAt).toLocaleString('es-ES'):''};const inp=x=>{const[k,l]=x,t=k==='email'?'email':k==='telefono'?'tel':'text',cl=k==='cupsE'?'ee':k==='cupsG'?'gg':'';return `<label class="field ${cl}">${esc(l)} <span class="optional">(OPCIONAL)</span><input type="${t}" data-k="${k}" data-upper="${k==='email'?'0':'1'}" value="${esc(o[k]||'')}"></label>`},blo=(tit,g)=>{const a=defs.filter(x=>x[2]===g);return a.length?`<div class="card"><h2>${tit}</h2>${a.map(inp).join('')}</div>`:''},legal=f.showLegal?`<div class="card legal"><h2>INFORMACIÓN</h2><p>${esc(tpl(f.legalText||'',vars))}</p></div>`:'',cons=f.consentEnabled?`<div class="card"><label class="consent"><input id="cons" type="checkbox"><span>${esc(tpl(f.consentText||'',vars))}${f.consentRequired?' <strong>(OBLIGATORIO)</strong>':' <span class="optional">(OPCIONAL)</span>'}</span></label></div>`:'',sig=f.signatureRequired?`<div class="card"><h2>FIRMA DEL CLIENTE</h2><canvas id="sig"></canvas><div class="row"><button class="secondary" onclick="firma()">BORRAR FIRMA</button></div><p class="small">FIRMA CON EL DEDO EN EL RECUADRO.</p></div>`:'';document.getElementById('app').innerHTML=`<div id="err" class="error"></div><div class="warn">Este formulario se procesa en tu navegador. Al finalizar se generará un archivo de respuesta para reenviar manualmente a la empresa.</div><div class="card brand">${b.logo?`<img src="${b.logo}" alt="Logo">`:''}<div><strong>${esc(b.empresa||'')}</strong><div class="small">${esc(b.telefono||'')} ${b.email?'· '+esc(b.email):''}</div></div></div><div class="card"><h1>${esc(f.name||'FORMULARIO')}</h1><div class="small">${esc(payload.notice?.code||'')} · FORMULARIO DEL CLIENTE</div></div><div class="note">${esc(tpl(f.intro||'',vars))}</div>${blo('DATOS PERSONALES Y CONTACTO','P')}${blo('SUMINISTRO','S')}${legal}${cons}${sig}<div class="card"><button class="btn" onclick="preparar()">PREPARAR RESPUESTA</button></div>`;document.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{if(i.dataset.upper==='1'){const p=i.selectionStart;i.value=may(i.value);try{i.setSelectionRange(p,p)}catch(_){}}});if(f.signatureRequired)setTimeout(firma,60)}
function preparar(){document.getElementById('err')?.classList.remove('show');const f=payload.form||{},r={cliente:'',contacto:'',nif:'',telefono:'',email:'',iban:'',direccion:'',cp:'',localidad:'',provincia:'',refCatastral:'',cupsE:'',cupsG:''};let em=null;document.querySelectorAll('[data-k]').forEach(i=>{let v=String(i.value||'').trim();if(i.dataset.k==='email'){if(v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))em=i}else v=may(v);if(i.dataset.k==='iban')v=iban(v);r[i.dataset.k]=v});if(em){error('REVISA EL CORREO ELECTRÓNICO');em.focus();return}if(f.consentEnabled&&f.consentRequired&&!document.getElementById('cons')?.checked){error('DEBES MARCAR EL CONSENTIMIENTO');return}if(f.signatureRequired&&!firmado){error('LA FIRMA ES OBLIGATORIA');return}const now=new Date().toISOString(),c=document.getElementById('sig');respuestaFinal={_type:RESP,version:1,notice:payload.notice,form:{id:f.id,name:f.name},original:payload.original||{},response:r,signature:f.signatureRequired&&c?c.toDataURL('image/png'):'',consent:{shown:!!f.consentEnabled,accepted:!!document.getElementById('cons')?.checked,text:f.consentText||'',at:now},submittedAt:now};document.getElementById('app').innerHTML=`<div class="card success"><h2>RESPUESTA PREPARADA</h2><p>${esc(f.successText||'FORMULARIO COMPLETADO.')}</p><p class="small">ENVÍA EL ARCHIVO DE RESPUESTA A LA EMPRESA POR WHATSAPP O CORREO.</p><button class="btn" onclick="compartir()">COMPARTIR RESPUESTA</button><button class="secondary" style="width:100%;margin-top:9px" onclick="descargar()">DESCARGAR RESPUESTA</button></div>`}
function nombre(){const s=x=>may(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');return `RESPUESTA_${s(respuestaFinal.notice?.code||'AVISO')}_${s(respuestaFinal.form?.name||'FORMULARIO')}.json`}
function archivo(){return new File([JSON.stringify(respuestaFinal,null,2)],nombre(),{type:'application/json'})}
function descargar(){const f=archivo(),u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function compartir(){const f=archivo();try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({title:'RESPUESTA '+(respuestaFinal.notice?.code||''),text:'Reenvía este archivo de respuesta a la empresa.',files:[f]});return}}catch(e){if(e?.name==='AbortError')return}descargar()}
try{render()}catch(e){document.getElementById('app').innerHTML=`<div class="card"><h2>NO SE PUDO ABRIR EL FORMULARIO</h2><p>${esc(e.message||'ENLACE NO VÁLIDO')}</p></div>`}
</script></body></html>
