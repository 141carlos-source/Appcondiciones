<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0b5ed7"><title>ACTUALIZACIÓN DE DATOS</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182033;font-family:Arial,sans-serif;padding:14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:16px}h1{font-size:21px;margin:0 0 8px;color:#173b68}.muted{font-size:12px;color:#667085;line-height:1.45}label{display:block;font-size:12px;font-weight:800;color:#667085;margin:10px 0;text-transform:uppercase}input{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;text-transform:uppercase}input[type=email]{text-transform:lowercase}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #dbe3ee;border-radius:11px;padding:11px;margin:10px 0}.row input{width:24px;height:24px;margin:0}.btn{width:100%;margin-top:10px;padding:13px;border-radius:11px;border:1px solid #0b5ed7;background:#0b5ed7;color:#fff;font-weight:900;font-size:16px}.alt{background:#fff;color:#0b5ed7}.status{margin-top:10px;font-size:12px;font-weight:800;color:#166534;white-space:pre-wrap}.err{color:#b42318}</style></head><body><div class="card"><h1>ACTUALIZACIÓN DE DATOS</h1><p id="empresa" class="muted"></p><p class="muted">REVISA LOS DATOS, CORRIGE LO NECESARIO Y PULSA “ENVIAR DATOS POR CORREO”. LOS DATOS TÉCNICOS DE LA INSTALACIÓN NO SE MODIFICAN AQUÍ.</p><div id="fields"></div><label>IBAN ACTUAL<input id="ibanActual" readonly></label><label>NUEVO IBAN (SOLO SI CAMBIA)<input id="ibanNuevo" autocomplete="off"></label><div class="row"><b>CONTRATO DE ELECTRICIDAD</b><input id="contrato" type="checkbox"></div><button id="send" class="btn">✉ ENVIAR DATOS POR CORREO</button><button id="copy" class="btn alt">COPIAR DATOS</button><div id="estado" class="status"></div></div><script>(function(){'use strict';var K=[['cliente','CLIENTE / RAZÓN SOCIAL','text'],['contacto','PERSONA DE CONTACTO','text'],['nif','DNI / NIF / CIF','text'],['telefono','TELÉFONO','text'],['email','CORREO ELECTRÓNICO','email'],['direccion','DIRECCIÓN DEL SUMINISTRO','text'],['cp','CÓDIGO POSTAL','text'],['localidad','LOCALIDAD','text'],['provincia','PROVINCIA','text'],['cupsE','CUPS ELECTRICIDAD','text'],['cupsG','CUPS GAS','text'],['refCatastral','REFERENCIA CATASTRAL','text']];function e(id){return document.getElementById(id)}function dec(s){s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}function normIban(v){return String(v||'').replace(/\s+/g,'').toUpperCase()}function ibanOk(v){v=normIban(v);if(!v)return true;if(!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(v))return false;var r=v.slice(4)+v.slice(0,4),num='';for(var i=0;i<r.length;i++){var c=r.charCodeAt(i);num+=c>=65&&c<=90?String(c-55):r[i]}var rem=0;for(var j=0;j<num.length;j++)rem=(rem*10+Number(num[j]))%97;return rem===1}var P;try{var m=location.hash.match(/(?:^#|&)d=([^&]+)/);if(!m)throw new Error('ENLACE INCOMPLETO');P=dec(m[1])}catch(err){document.body.innerHTML='<div class="card"><h1>NO SE PUDO ABRIR EL FORMULARIO</h1><p>'+String(err.message||err)+'</p></div>';return}e('empresa').textContent=String(P.empresa||'EMPRESA')+' · AVISO '+P.id;e('fields').innerHTML=K.map(function(k){return '<label>'+k[1]+'<input id="f_'+k[0]+'" type="'+k[2]+'"></label>'}).join('');K.forEach(function(k){var x=e('f_'+k[0]);x.value=(P.x&&P.x[k[0]])||'';x.addEventListener('input',function(){x.value=k[2]==='email'?x.value.toLowerCase():x.value.toUpperCase()})});e('ibanActual').value=(P.x&&P.x.iban)||'NO INFORMADO';e('contrato').checked=!!(P.x&&P.x.contrato);e('ibanNuevo').addEventListener('input',function(){this.value=this.value.toUpperCase()});function body(){var ni=normIban(e('ibanNuevo').value);if(ni&&!ibanOk(ni))throw new Error('EL NUEVO IBAN NO ES VÁLIDO.');var lines=['ACTUALIZACIÓN DE DATOS · AVISO '+P.id,''];K.forEach(function(k){var v=e('f_'+k[0]).value.trim();if(k[2]!=='email')v=v.toUpperCase();else v=v.toLowerCase();lines.push(k[1]+': '+v)});lines.push('NUEVO IBAN: '+(ni||'SIN CAMBIO'));lines.push('CONTRATO DE ELECTRICIDAD: '+(e('contrato').checked?'SÍ':'NO'));return lines.join('\n')}e('send').onclick=function(){try{var b=body(),to=String(P.returnEmail||'').trim().toLowerCase(),a=document.createElement('a');a.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('ACTUALIZACIÓN DE DATOS · AVISO '+P.id)+'&body='+encodeURIComponent(b);document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);e('estado').className='status';e('estado').textContent='CORREO PREPARADO. REVÍSALO Y PULSA ENVIAR.'}catch(err){e('estado').className='status err';e('estado').textContent=err.message}};e('copy').onclick=function(){try{var b=body();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(b).then(function(){e('estado').textContent='DATOS COPIADOS.'});else{e('estado').textContent=b}}catch(err){e('estado').className='status err';e('estado').textContent=err.message}}})();</script></body></html>
