<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>APP Avisos</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APP Avisos">
<style>
:root{--azul:#0b5ed7;--linea:#dbe3ee;--texto:#182033;--muted:#667085}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:var(--texto)}
body{height:100dvh;display:grid;grid-template-rows:auto 1fr}
#installBar{display:flex;gap:10px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1px solid var(--linea);z-index:5}
#installText{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.25}
#installText strong{display:block;color:var(--texto);font-size:13px}
#installBtn{border:1px solid var(--azul);background:var(--azul);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px;white-space:nowrap}
#appFrame{border:0;width:100%;height:100%;display:block;background:#f4f7fb}
@media(display-mode:standalone){body{grid-template-rows:1fr}#installBar{display:none}}
</style>
</head>
<body>
<div id="installBar">
  <div id="installText"><strong>APP Avisos · V1.19</strong>Memoria Técnica conectada a los datos de la APP instalada.</div>
  <button id="installBtn" type="button">Instalar</button>
</div>
<iframe id="appFrame" title="APP Avisos V1.19" src="../avisos-v119/"></iframe>
<script>
(function(){
'use strict';
var promptInstalacion=null;
var btn=document.getElementById('installBtn');
var txt=document.getElementById('installText');
function instalada(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function estado(){if(instalada()){document.getElementById('installBar').style.display='none';}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();promptInstalacion=e;btn.disabled=false;});
window.addEventListener('appinstalled',function(){promptInstalacion=null;estado();});
btn.addEventListener('click',function(){
  if(promptInstalacion){promptInstalacion.prompt();promptInstalacion.userChoice.then(function(){promptInstalacion=null;estado();}).catch(function(){});return;}
  txt.innerHTML='<strong>Instalación</strong>En Brave/Chrome abre el menú ⋮ y elige “Instalar aplicación” o “Añadir a pantalla de inicio”.';
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('SW',e);});}
estado();
})();
</script>
</body>
</html>
