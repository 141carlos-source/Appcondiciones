<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOLTEC · Agenda V1</title>
<style>
:root{--red:#e7281c;--ink:#172b4d;--muted:#667085;--line:#dbe3ee;--soft:#f6f8fb;--ok:#12805c;--warn:#b7791f;--blue:#2463eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#eef2f6;color:#1f2937}.app{max-width:1500px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.mark{width:36px;height:36px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0;color:var(--ink)}.brand small{display:block;color:var(--muted);font-size:11px}.primary,.ghost,.danger{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink)}.primary{background:var(--red);color:#fff;border-color:var(--red)}.danger{color:#b42318;border-color:#f1a7a1}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 66px)}.side{border-right:1px solid var(--line);padding:14px;background:#fbfcfe}.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}.metric b{font-size:22px;color:var(--ink)}.metric span{display:block;font-size:12px;color:var(--muted)}.unscheduled{display:grid;gap:8px}.mini{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:10px;background:#fff;cursor:pointer}.mini strong{display:block;font-size:13px}.mini small{display:block;color:var(--muted);margin-top:3px}.main{padding:14px;overflow:auto}.weekhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.weekhead h2{font-size:18px;margin:0;color:var(--ink);flex:1}.week{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;min-width:1120px}.day{background:var(--soft);border:1px solid var(--line);border-radius:14px;min-height:620px;overflow:hidden}.day.today{box-shadow:0 0 0 2px rgba(231,40,28,.18)}.dayhead{background:#fff;padding:11px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.dayhead strong{color:var(--ink)}.dayhead span{font-size:12px;color:var(--muted)}.slot{padding:8px;display:grid;gap:8px}.job{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 2px 8px rgba(15,23,42,.04);cursor:pointer}.job.dragging{opacity:.45}.day.dragover{box-shadow:0 0 0 3px rgba(36,99,235,.25);background:#eef4ff}.job.high{border-left:5px solid var(--red)}.job.medium{border-left:5px solid var(--warn)}.job.low{border-left:5px solid var(--blue)}.jobtop{display:flex;justify-content:space-between;gap:8px}.time{font-weight:900;color:var(--ink)}.status{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;background:#eef2f6;color:#475467}.job h4{margin:6px 0 2px;font-size:14px;color:var(--ink)}.job p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.50);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{background:#fff;width:min(780px,100%);max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.sheethead{display:flex;align-items:center;gap:10px}.sheethead h2{margin:0;flex:1;color:var(--ink)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.wide{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#344054}input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #cfd7e3;border-radius:9px;background:#fff;font:inherit;color:#1f2937}textarea{min-height:90px;resize:vertical}.formactions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.hint{font-size:11px;color:var(--muted);margin-top:5px}.mobile-days{display:none;gap:6px;overflow:auto;margin-bottom:10px}.mobile-days button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172b4d;color:#fff;padding:10px 14px;border-radius:10px;z-index:70;display:none}.toast.show{display:block}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.week{grid-template-columns:1fr;min-width:0}.mobile-days{display:flex}.day:not(.mobile-active){display:none}.day{min-height:auto}.formgrid{grid-template-columns:1fr}.brand small{display:none}.top{align-items:flex-start}.primary{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">S</div><div><h1>SOLTEC · Agenda</h1><small>V1 independiente · sin conexión con Avisos ni Partes</small></div></div><button class="primary" id="newBtn">＋ Nueva cita</button></header>
<div class="layout">
<aside class="side"><h3>Resumen semanal</h3><div class="metric"><b id="mPlanned">0</b><span>trabajos planificados</span></div><div class="metric"><b id="mHours">0 h</b><span>carga estimada</span></div><div class="metric"><b id="mPending">0</b><span>sin planificar</span></div><h3>Sin planificar</h3><div id="unscheduled" class="unscheduled"></div></aside>
<main class="main"><div class="weekhead"><button class="ghost" id="prev">‹</button><h2 id="weekTitle"></h2><button class="ghost" id="todayBtn">Hoy</button><button class="ghost" id="next">›</button></div><div id="mobileDays" class="mobile-days"></div><div id="week" class="week"></div></main>
</div></div>
<div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h2 id="formTitle">Nueva cita</h2><button class="ghost" id="closeBtn">Cerrar</button></div><form id="form"><input type="hidden" id="id"><div class="formgrid">
<label class="wide">Título del trabajo<input id="title" required placeholder="Ej.: Revisión instalación"></label>
<label>Cliente<input id="client" placeholder="Cliente o comunidad"></label><label>Obra<input id="work" placeholder="Nombre de obra"></label>
<label class="wide">Dirección<input id="address" placeholder="Dirección completa"></label>
<label>Teléfono<input id="phone" type="tel"></label><label>Técnico<input id="tech" placeholder="Técnico asignado"></label>
<label>Fecha<input id="date" type="date"></label><label>Hora<input id="time" type="time"></label><label class="wide">Reprogramación rápida<div id="quickMove" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div></label>
<label>Duración estimada (h)<input id="duration" inputmode="decimal" placeholder="Ej.: 1,5"></label><label>Prioridad<select id="priority"><option value="medium">Media</option><option value="high">Alta</option><option value="low">Baja</option></select></label>
<label>Estado<select id="status"><option>Pendiente</option><option>Confirmado</option><option>En curso</option><option>Terminado</option><option>Aplazado</option><option>Cancelado</option></select></label><label>Alarma<select id="alarm"><option value="">Sin alarma</option><option>30 min antes</option><option>1 h antes</option><option>2 h antes</option><option>1 día antes</option></select></label>
<label class="wide">Notas<textarea id="notes" placeholder="Observaciones, material, indicaciones..."></textarea></label>
</div><div class="hint">Para dejar un trabajo “sin planificar”, guarda la cita sin fecha.</div><div class="formactions"><button type="button" class="danger" id="deleteBtn" hidden>Eliminar</button><button type="button" class="ghost" id="cancelBtn">Cancelar</button><button class="primary" type="submit">Guardar cita</button></div></form></div></div>
<div id="toast" class="toast"></div>
<script>
(function(){'use strict';
const KEY='SOLTEC_AGENDA_V1_DEMO';
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
let weekStart=startOfWeek(new Date()), editing=null;
function startOfWeek(d){const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseDate(s){const p=String(s||'').split('-').map(Number);return p.length===3?new Date(p[0],p[1]-1,p[2],12):null}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(_){return[]}}
function write(rows){localStorage.setItem(KEY,JSON.stringify(rows))}
function seed(){if(localStorage.getItem(KEY))return;const base=startOfWeek(new Date()), d=n=>{const x=new Date(base);x.setDate(x.getDate()+n);return iso(x)};write([
{id:'A1',title:'Avería cuadro eléctrico',client:'Talleres Aragón',work:'Taller',address:'C/ Río Huerva 18',phone:'',tech:'Carlos',date:d(0),time:'08:00',duration:'1.5',priority:'high',status:'Confirmado',alarm:'30 min antes',notes:''},
{id:'A2',title:'Instalación luminarias',client:'Oficinas Delta',work:'Reforma oficinas',address:'Paseo Independencia 21',phone:'',tech:'Carlos',date:d(1),time:'08:30',duration:'4',priority:'medium',status:'Pendiente',alarm:'1 día antes',notes:''},
{id:'A3',title:'Revisión presupuesto',client:'Obra Residencial Ebro',work:'Residencial Ebro',address:'Av. Ranillas 9',phone:'',tech:'Carlos',date:d(3),time:'16:30',duration:'3',priority:'low',status:'Confirmado',alarm:'1 h antes',notes:''},
{id:'A4',title:'Revisión cuadro general',client:'Comunidad Plaza Norte',work:'',address:'',phone:'',tech:'',date:'',time:'',duration:'2',priority:'medium',status:'Pendiente',alarm:'',notes:''}
])}
function toast(t){const n=$('toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1800)}
function hours(v){const n=parseFloat(String(v||'').replace(',','.'));return Number.isFinite(n)?n:0}
function render(){const rows=read(), end=new Date(weekStart);end.setDate(end.getDate()+4);$('weekTitle').textContent='Semana · '+weekStart.toLocaleDateString('es-ES',{day:'numeric',month:'long'})+' – '+end.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});let planned=0,totalH=0,pending=0;rows.forEach(r=>{if(r.date){const dt=parseDate(r.date);if(dt>=weekStart&&dt<=end){planned++;totalH+=hours(r.duration)}}else pending++});$('mPlanned').textContent=planned;$('mHours').textContent=(Math.round(totalH*10)/10).toString().replace('.',',')+' h';$('mPending').textContent=pending;renderPending(rows);renderWeek(rows);}
function renderPending(rows){const box=$('unscheduled'),arr=rows.filter(r=>!r.date);box.innerHTML=arr.length?arr.map(r=>'<div class="mini" data-id="'+esc(r.id)+'"><strong>'+esc(r.title||'Sin título')+'</strong><small>'+esc(r.client||'Sin cliente')+(r.duration?' · '+esc(r.duration)+' h':'')+'</small></div>').join(''):'<div class="empty">No hay trabajos sin planificar.</div>';box.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>openEdit(n.dataset.id))}
function renderWeek(rows){const names=['Lunes','Martes','Miércoles','Jueves','Viernes'],today=iso(new Date()),week=$('week'),tabs=$('mobileDays');let html='',th='';for(let i=0;i<5;i++){const d=new Date(weekStart);d.setDate(d.getDate()+i);const ds=iso(d),arr=rows.filter(r=>r.date===ds).sort((a,b)=>String(a.time).localeCompare(String(b.time))),sum=arr.reduce((s,r)=>s+hours(r.duration),0);html+='<section class="day '+(ds===today?'today ':'')+(i===0?'mobile-active':'')+'" data-day="'+i+'"><div class="dayhead"><strong>'+names[i]+' '+d.getDate()+(ds===today?' · Hoy':'')+'</strong><span>'+String(Math.round(sum*10)/10).replace('.',',')+' h</span></div><div class="slot">'+(arr.length?arr.map(card).join(''):'<div class="empty">Sin trabajos</div>')+'</div></section>';th+='<button data-mobile-day="'+i+'">'+names[i].slice(0,3)+' '+d.getDate()+'</button>'}week.innerHTML=html;tabs.innerHTML=th;week.querySelectorAll('[data-job-id]').forEach(n=>{n.onclick=()=>openEdit(n.dataset.jobId);n.draggable=true;n.addEventListener('dragstart',e=>{n.classList.add('dragging');e.dataTransfer.setData('text/plain',n.dataset.jobId)});n.addEventListener('dragend',()=>n.classList.remove('dragging'))});week.querySelectorAll('.day').forEach(day=>{day.addEventListener('dragover',e=>{e.preventDefault();day.classList.add('dragover')});day.addEventListener('dragleave',()=>day.classList.remove('dragover'));day.addEventListener('drop',e=>{e.preventDefault();day.classList.remove('dragover');const id=e.dataTransfer.getData('text/plain'),rows=read(),r=rows.find(x=>x.id===id);if(!r)return;const d=new Date(weekStart);d.setDate(d.getDate()+Number(day.dataset.day||0));r.date=iso(d);if(!r.time)r.time='08:00';write(rows);render();toast('Cita reprogramada')})});tabs.querySelectorAll('[data-mobile-day]').forEach(b=>b.onclick=()=>showMobile(Number(b.dataset.mobileDay))}
function card(r){return '<article class="job '+esc(r.priority||'medium')+'" data-job-id="'+esc(r.id)+'"><div class="jobtop"><span class="time">'+esc(r.time||'—')+'</span><span class="status">'+esc(String(r.status||'Pendiente').toUpperCase())+'</span></div><h4>'+esc(r.title||'Sin título')+'</h4><p>'+esc(r.client||'Sin cliente')+'</p><p>'+esc(r.address||'')+'</p>'+(r.duration||r.alarm?'<p style="margin-top:6px">'+(r.duration?'⏱ '+esc(r.duration)+' h ':'')+(r.alarm?' · ⏰ '+esc(r.alarm):'')+'</p>':'')+'</article>'}
function showMobile(i){document.querySelectorAll('.day').forEach((n,k)=>n.classList.toggle('mobile-active',k===i))}
function resetForm(){editing=null;$('form').reset();$('id').value='';$('priority').value='medium';$('status').value='Pendiente';$('deleteBtn').hidden=true;$('formTitle').textContent='Nueva cita'}
function openNew(){resetForm();renderQuickMove();$('modal').classList.add('open');setTimeout(()=>$('title').focus(),50)}
function renderQuickMove(){const box=$('quickMove');if(!box)return;const names=['Lun','Mar','Mié','Jue','Vie'];box.innerHTML=names.map((n,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return '<button type="button" class="ghost" data-qday="'+iso(d)+'">'+n+' '+d.getDate()+'</button>'}).join('')+'<button type="button" class="ghost" data-qday="">Sin planificar</button>';box.querySelectorAll('[data-qday]').forEach(b=>b.onclick=()=>{$('date').value=b.dataset.qday;if(b.dataset.qday&&!$('time').value)$('time').value='08:00';toast(b.dataset.qday?'Fecha preparada':'Marcado sin planificar')})}
function openEdit(id){const r=read().find(x=>x.id===id);if(!r)return;editing=id;$('formTitle').textContent='Editar cita';['id','title','client','work','address','phone','tech','date','time','duration','priority','status','alarm','notes'].forEach(k=>$(k).value=r[k]||'');$('deleteBtn').hidden=false;renderQuickMove();$('modal').classList.add('open')}
function close(){ $('modal').classList.remove('open') }
function save(ev){ev.preventDefault();const rows=read(),obj={id:editing||('AG-'+Date.now()),title:$('title').value.trim(),client:$('client').value.trim(),work:$('work').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),tech:$('tech').value.trim(),date:$('date').value,time:$('time').value,duration:$('duration').value.trim(),priority:$('priority').value,status:$('status').value,alarm:$('alarm').value,notes:$('notes').value.trim()};if(!obj.title)return;const idx=rows.findIndex(x=>x.id===obj.id);if(idx>=0)rows[idx]=obj;else rows.push(obj);write(rows);close();render();toast('Cita guardada')}
function del(){if(!editing)return;const rows=read(),r=rows.find(x=>x.id===editing);if(!confirm('¿Eliminar definitivamente '+(r&&r.title||'esta cita')+'?'))return;write(rows.filter(x=>x.id!==editing));close();render();toast('Cita eliminada')}
$('newBtn').onclick=openNew;$('closeBtn').onclick=close;$('cancelBtn').onclick=close;$('deleteBtn').onclick=del;$('form').onsubmit=save;$('prev').onclick=()=>{weekStart.setDate(weekStart.getDate()-7);render()};$('next').onclick=()=>{weekStart.setDate(weekStart.getDate()+7);render()};$('todayBtn').onclick=()=>{weekStart=startOfWeek(new Date());render()};$('modal').onclick=e=>{if(e.target===$('modal'))close()};seed();render();
})();
</script>
</body></html>
