<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e7281c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SOLTEC Avisos">
  <title>SOLTEC Avisos V1.35</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
    body{height:100dvh}iframe{display:block;border:0;width:100%;height:100%;background:#f4f7fb}
    .install{position:fixed;right:12px;top:10px;z-index:500;border:0;border-radius:999px;background:#e7281c;color:#fff;padding:10px 14px;font:700 13px Arial;box-shadow:0 4px 16px rgba(0,0,0,.22);display:none}
    .install.show{display:block}.installed .install{display:none}.fatal{padding:20px;color:#b42318;font-weight:700}
  </style>
</head>
<body>
  <iframe id="app134" title="SOLTEC Avisos V1.35" allow="local-network; loopback-network; local-network-access"></iframe>
  <button id="installBtn" class="install" type="button">⬇ INSTALAR SOLTEC</button>
  <script src="./appupdate134.js"></script>
  <script src="./install.js"></script>
  <script src="./app133.js"></script>
  <script src="./technical135.js"></script>
  <script src="./patch133.js"></script>
  <script src="./plan133.js"></script>
  <script src="./photos133.js"></script>
  <script src="./photos133fix.js"></script>
  <script src="./technical135render.js"></script>
  <script src="./cnmc133.js"></script>
  <script src="./print133fix.js"></script>
  <script src="./stabilize133.js"></script>
  <script src="./normalize134.js"></script>
  <script src="./companybase134.js"></script>
  <script src="./companyaccordion134.js"></script>
  <script src="./partes135storage.js"></script>
  <script src="./partes135pdf.js"></script>
  <script src="./partes135.js"></script>
  <script src="./sync135localnetwork.js"></script>
  <script src="./sync134engine.js"></script>
  <script src="./sync135guard.js"></script>
  <script src="./sync134audit.js"></script>
  <script src="./nav134fix.js"></script>
  <script src="./compact135.js"></script>
  <script src="./avisoslist135.js"></script>
  <script src="./emails135.js"></script>
  <script src="./detailsclosed135.js"></script>
  <script>
    (async function () {
      try {
        let html = await (await fetch('./core-template.html', { cache: 'no-store' })).text();
        html = html
          .replaceAll('APP Avisos V1.17B · CartoCiudad corregido', 'SOLTEC Avisos V1.35')
          .replaceAll('APP Avisos', 'SOLTEC')
          .replaceAll('V1.17B PRUEBA · CartoCiudad corregido', 'V1.35 · AVISOS + PARTES')
          .replaceAll('V1.17B mantiene los datos persistentes de V1.16 y corrige la consulta CartoCiudad para navegador.', 'V1.35 · Avisos y Partes conectados con sincronización central.')
          .replace(/indexedDB\.open\(DB_NAME\s*,\s*1\)/g, 'indexedDB.open(DB_NAME,3)')
          .replace("if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE);", "if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE);if(!db.objectStoreNames.contains('planos'))db.createObjectStore('planos');");
        html = html
          .replace('function normalizarAviso(a)', "function normalizarTension(v){var x=String(v||'').toUpperCase();if(x.indexOf('3X230 V')>=0&&x.indexOf('400')<0)return '3X230 V';if(x.indexOf('400')>=0)return '3X230/400V';return '230 V MONOFÁSICA';}function normalizarAviso(a)")
          .replace("tension:String(a.tension||'').includes('400')?'400 V TRIFÁSICA':'230 V MONOFÁSICA'", 'tension:normalizarTension(a.tension)')
          .replace('direccion:text(a.direccion),cp:text(a.cp)', 'direccion:text(a.direccion),piso:text(a.piso),puerta:text(a.puerta),cp:text(a.cp)')
          .replaceAll("'avDireccion','avCp'", "'avDireccion','avPiso','avPuerta','avCp'")
          .replace("setValue('avDireccion',a.direccion);setValue('avCp'", "setValue('avDireccion',a.direccion);setValue('avPiso',a.piso);setValue('avPuerta',a.puerta);setValue('avCp'")
          .replace("direccion:getValue('avDireccion'),cp:getValue('avCp')", "direccion:getValue('avDireccion'),piso:getValue('avPiso'),puerta:getValue('avPuerta'),cp:getValue('avCp')")
          .replace('a.refCatastral,a.direccion,a.cp', 'a.refCatastral,a.direccion,a.piso,a.puerta,a.cp')
          .replace("(a.direccion?' · '+esc(a.direccion):'')+(ubicacion", "(a.direccion?' · '+esc(a.direccion):'')+(a.piso?' · Piso '+esc(a.piso):'')+(a.puerta?' · Puerta '+esc(a.puerta):'')+(ubicacion")
          .replace("var w=String(tension||'').includes('400')?Math.sqrt(3)*400*i:230*i;", "var tv=String(tension||'').toUpperCase(),tri=tv.indexOf('3X')>=0,u=tv.indexOf('400')>=0?400:230,w=tri?Math.sqrt(3)*u*i:230*i;")
          .replace("[dir,getValue('avLocalidad')].filter(Boolean).join(', ')", "[dir,getValue('avLocalidad'),getValue('avProvincia')].filter(Boolean).join(', ')");
        if (!html.includes('function cartoBuscar(q)')) {
          html = html.replace('function resizeLogo(file)', 'function cartoBuscar(q){if(!q){cartoEstado("Completa la referencia catastral.",true);return;}cartoEstado("Consultando CartoCiudad…",false);cartoFetch(cartoUrlCandidates(q)).then(function(r){cartoCandidates=cartoNormalizarRespuesta(r);document.getElementById("cartoResultados").innerHTML=cartoCandidates.slice(0,6).map(function(c,i){return "<button type=\\"button\\" class=\\"cartoResult\\" onclick=\\"App.elegirCarto("+i+")\\">"+esc(c.address||c.name||"Resultado")+"</button>";}).join("");cartoEstado(cartoCandidates.length?"Selecciona el resultado correcto.":"Sin coincidencias.",!cartoCandidates.length);}).catch(function(){cartoEstado("No se pudo consultar CartoCiudad.",true);});}\nfunction resizeLogo(file)');
        }
        const frame = document.getElementById('app134');
        frame.onload = function () {
          const app = frame.contentWindow;
          window.Soltec132 && window.Soltec132.init(app);
          window.SoltecTechnical135 && window.SoltecTechnical135.init(app);
          window.Soltec132Fix && window.Soltec132Fix.init(app);
          window.Soltec133Plan && window.Soltec133Plan.init(app);
          window.Soltec133Photos && window.Soltec133Photos.init(app);
          window.Soltec133PhotosFix && window.Soltec133PhotosFix.init(app);
          window.Soltec132CNMC && window.Soltec132CNMC.init(app);
          window.Soltec133PrintFix && window.Soltec133PrintFix.init(app);
          window.Soltec133Stabilize && window.Soltec133Stabilize.init(app);
          window.Soltec134Normalize && window.Soltec134Normalize.init(app);
          window.Soltec134CompanyBase && window.Soltec134CompanyBase.init(app);
          window.Soltec134CompanyAccordion && window.Soltec134CompanyAccordion.init(app);
          window.SoltecPartes135 && window.SoltecPartes135.init(app);
          window.Soltec135LocalNetwork && window.Soltec135LocalNetwork.init(app);
          window.Soltec134Engine && window.Soltec134Engine.init(app);
          window.Soltec135SyncGuard && window.Soltec135SyncGuard.init(app);
          window.Soltec134Audit && window.Soltec134Audit.init(app);
          window.Soltec134NavFix && window.Soltec134NavFix.init(app);
          window.SoltecCompact135 && window.SoltecCompact135.init(app);
          window.SoltecAvisosList135 && window.SoltecAvisosList135.init(app);
          window.SoltecEmails135 && window.SoltecEmails135.init(app);
          window.Soltec135DetailsClosed && window.Soltec135DetailsClosed.init(app);
          try {
            const d = app.document, header = d.querySelector('header .headerText');
            if (header) {
              const title = header.querySelector('strong'), version = header.querySelector('small');
              if (title) title.textContent = 'SOLTEC';
              if (version) version.textContent = 'V1.35 · AVISOS + PARTES';
            }
            const state = d.getElementById('bootState');
            if (state) state.textContent = 'V1.35 · BASE COMÚN + SYNC CENTRAL';
          } catch (_) {}
        };
        frame.srcdoc = html;
      } catch (error) {
        document.body.innerHTML = '<div class="fatal">No se pudo iniciar V1.35: ' + String(error.message || error) + '</div>';
      }
    })();
  </script>
</body>
</html>
