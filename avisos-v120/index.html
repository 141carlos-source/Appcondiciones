<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>APP Avisos V1.20 · RES-CNMC</title>
<style>
:root{--azul:#0b5ed7;--fondo:#f4f7fb;--texto:#182033;--muted:#6f7b8f;--linea:#dbe3ee}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--fondo);font-family:Arial,Helvetica,sans-serif;color:var(--texto)}
body{height:100dvh;display:grid;grid-template-rows:1fr auto;overflow:hidden}
#appView,#memView{min-height:0}#appView{display:block}#memView{display:none;overflow:auto;padding:14px 14px 96px}
iframe{border:0;width:100%;height:100%;display:block;background:var(--fondo)}
.card{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:14px;margin:0 auto 12px;max-width:900px}
h2{margin:0 0 10px;font-size:20px}p{line-height:1.45}.muted{color:var(--muted);font-size:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0}select{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;background:#fff;color:var(--texto)}
button{font:inherit;border:1px solid var(--azul);border-radius:12px;padding:11px 12px;font-weight:800;background:#fff;color:var(--azul)}.full{width:100%}
.bottom{background:#fff;border-top:1px solid var(--linea);display:grid;grid-template-columns:1fr 1fr;padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bottom button{border:0;background:transparent;color:#667085;padding:8px}.bottom button.active{color:var(--azul);background:#eef5ff}
.doc{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px;line-height:1.42}.head{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--linea);padding-bottom:12px}
.head img{width:96px;height:64px;object-fit:contain;border:1px solid var(--linea);border-radius:8px}.head h3{margin:0 0 4px;font-size:20px}.head small{display:block;color:var(--muted);font-size:12px}
.sec{margin:16px 0}.sec h4{margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--linea);font-size:13px;color:#24466e;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr;gap:5px 14px}.dato{font-size:13px}.dato b{color:#344054}
.plano{border:1px solid var(--linea);border-radius:10px;padding:8px;background:#fafcff}.plano img{display:block;width:100%;height:auto;border-radius:7px}.vacio{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--linea);border-radius:10px}.nota{font-size:11px;color:var(--muted);margin-top:10px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="appView"><iframe id="base118" title="APP Avisos V1.18" src="../avisos-v118/"></iframe></div>
<div id="memView">
  <div class="card"><h2>Memoria RES-CNMC · V1.20</h2><p class="muted">Vista previa de trabajo con los datos guardados del aviso, condiciones de suministro y plano de situación.</p><label>Aviso<select id="memSel"></select></label><button type="button" class="full" onclick="renderMemoria()">Actualizar vista previa</button></div>
  <div id="memBox" class="card"><div class="vacio">Selecciona un aviso.</div></div>
</div>
<nav class="bottom"><button id="navApp" class="active" onclick="showView('app')">☰<br>APP</button><button id="navMem" onclick="showView('mem')">▤<br>Memoria</button></nav>
<script>
(function(){'use strict';
var DATA_KEY='APP_AVISOS_WEB_DATOS_V116_PERSISTENTE',FLAGS_KEY='APP_AVISOS_FLAGS_V120',DB='APP_AVISOS_PERSISTENCIA',STORE='planos',STATE='estado',DBV=2,planUrl='',pendingFlags={condicionesSuministro:false,contratoElectricidad:false,iban:''};
function el(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function fecha(v){if(!v)return '';var p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(v)}function estado(v){return v==='en_curso'?'EN CURSO':v==='finalizado'?'FINALIZADO':'PENDIENTE'}
function dato(k,v){v=String(v==null?'':v).trim();return v?'<div class="dato"><b>'+esc(k)+':</b> '+esc(v)+'</div>':''}
function data(){try{return JSON.parse(localStorage.getItem(DATA_KEY)||'{}')}catch(e){return{}}}
function flags(){try{var x=JSON.parse(localStorage.getItem(FLAGS_KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return{}}}
function flagFor(id){var f=flags()[String(id)]||{};return {condicionesSuministro:f.condicionesSuministro===true,contratoElectricidad:f.contratoElectricidad===true,iban:String(f.iban||'')}}
function openDb(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB,DBV);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains(STATE))d.createObjectStore(STATE);if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}
function putState(k,v){return openDb().then(function(d){return new Promise(function(resolve,reject){var tx=d.transaction(STATE,'readwrite');tx.objectStore(STATE).put(v,k);tx.oncomplete=function(){d.close();resolve()};tx.onerror=function(){var e=tx.error;d.close();reject(e)}})})}
function getState(k){return openDb().then(function(d){return new Promise(function(resolve,reject){var tx=d.transaction(STATE,'readonly'),r=tx.objectStore(STATE).get(k);r.onsuccess=function(){var v=r.result;d.close();resolve(v)};r.onerror=function(){var e=r.error;d.close();reject(e)}})})}
function saveFlags(all){var raw=JSON.stringify(all||{});try{localStorage.setItem(FLAGS_KEY,raw)}catch(e){}putState(FLAGS_KEY,raw).catch(function(){})}
function recoverFlags(){if(localStorage.getItem(FLAGS_KEY))return Promise.resolve();return getState(FLAGS_KEY).then(function(raw){if(raw)try{localStorage.setItem(FLAGS_KEY,raw)}catch(e){}}).catch(function(){})}
function setFlag(id,f){if(!id)return;var all=flags();all[String(id)]={condicionesSuministro:!!f.condicionesSuministro,contratoElectricidad:!!f.contratoElectricidad,iban:String(f.iban||'')};saveFlags(all)}
function getPlan(k){return openDb().then(function(d){return new Promise(function(resolve,reject){var tx=d.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get(String(k));r.onsuccess=function(){var v=r.result;d.close();resolve(v||null)};r.onerror=function(){var e=r.error;d.close();reject(e)}})})}
function revoke(){if(planUrl){try{URL.revokeObjectURL(planUrl)}catch(e){}planUrl=''}}
function normalizarIban(v){return String(v||'').replace(/\s+/g,'').toUpperCase()}function formatearIban(v){v=normalizarIban(v);return v.replace(/(.{4})/g,'$1 ').trim()}function ibanValido(v){v=normalizarIban(v);if(!v)return true;if(!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(v))return false;var r=v.slice(4)+v.slice(0,4),num='';for(var i=0;i<r.length;i++){var c=r.charCodeAt(i);num+=c>=65&&c<=90?String(c-55):r[i]}var rem=0;for(var j=0;j<num.length;j++)rem=(rem*10+Number(num[j]))%97;return rem===1}function ibanMask(v){v=normalizarIban(v);if(!v)return '';return v.slice(0,4)+' •••• •••• •••• '+v.slice(-4)}
function fillOptions(){var p=data(),a=Array.isArray(p.avisos)?p.avisos.slice():[],s=el('memSel'),old=s.value;a.sort(function(x,y){return String(y.fecha||'').localeCompare(String(x.fecha||''))||Number(y.id)-Number(x.id)});s.innerHTML=a.length?a.map(function(x){return '<option value="'+Number(x.id)+'">'+esc(fecha(x.fecha)+' · '+(x.cliente||'SIN CLIENTE')+' · '+(x.direccion||x.concepto||''))+'</option>'}).join(''):'<option value="">No hay avisos</option>';if(old&&a.some(function(x){return String(x.id)===String(old)}))s.value=old}
function deepFrame(){try{var f=el('base118'),d=f.contentDocument;if(!d)return null;var inner=d.getElementById('app');return inner&&inner.contentWindow?inner:null}catch(e){return null}}
function deepDoc(){var f=deepFrame();return f?f.contentDocument:null}function deepWin(){var f=deepFrame();return f?f.contentWindow:null}
function updateSwitchText(d){var a=d.getElementById('avCondicionesSuministro'),b=d.getElementById('avContratoElectricidad'),ta=d.getElementById('txtCondicionesSuministro'),tb=d.getElementById('txtContratoElectricidad');if(ta)ta.textContent=a&&a.checked?'SÍ':'NO';if(tb)tb.textContent=b&&b.checked?'SÍ':'NO'}
function setSwitches(f){var d=deepDoc();if(!d)return;var a=d.getElementById('avCondicionesSuministro'),b=d.getElementById('avContratoElectricidad'),ib=d.getElementById('avIbanCliente');if(a)a.checked=!!f.condicionesSuministro;if(b)b.checked=!!f.contratoElectricidad;if(ib)ib.value=formatearIban(f.iban||'');updateSwitchText(d)}
function readSwitches(){var d=deepDoc();if(!d)return {condicionesSuministro:false,contratoElectricidad:false,iban:''};var a=d.getElementById('avCondicionesSuministro'),b=d.getElementById('avContratoElectricidad'),ib=d.getElementById('avIbanCliente');return {condicionesSuministro:!!(a&&a.checked),contratoElectricidad:!!(b&&b.checked),iban:normalizarIban(ib&&ib.value)}}
function installSwitches(){var d=deepDoc(),w=deepWin();if(!d||!w||!w.App)return false;if(d.getElementById('v120Flags'))return true;
var st=d.createElement('style');st.textContent='.v120Flags{border:1px solid #bfd2eb;border-radius:13px;padding:10px;background:#f8fbff;margin:6px 0 10px}.v120SwitchRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e4edf7}.v120SwitchRow:last-child{border-bottom:0}.v120SwitchRow>span{font-size:13px;font-weight:800;color:#24466e}.v120Ctl{display:flex;align-items:center;gap:8px}.v120Ctl b{min-width:24px;font-size:12px;color:#475467}.v120Switch{position:relative;display:inline-block;width:54px;height:30px;margin:0}.v120Switch input{opacity:0;width:0;height:0}.v120Slider{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s}.v120Slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:white;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}.v120Switch input:checked+.v120Slider{background:#0b5ed7}.v120Switch input:checked+.v120Slider:before{transform:translateX(24px)}.v120Iban{margin:4px 0 10px}.v120Iban input{letter-spacing:.04em}';d.head.appendChild(st);
var box=d.createElement('div');box.id='v120Flags';box.className='wide v120Flags';box.innerHTML='<label class="v120Iban">IBAN del cliente<input id="avIbanCliente" inputmode="text" autocomplete="off" placeholder="ES00 0000 0000 0000 0000 0000"></label><div class="v120SwitchRow"><span>Condiciones de suministro</span><div class="v120Ctl"><b id="txtCondicionesSuministro">NO</b><label class="v120Switch"><input id="avCondicionesSuministro" type="checkbox"><span class="v120Slider"></span></label></div></div><div class="v120SwitchRow"><span>Contrato de electricidad</span><div class="v120Ctl"><b id="txtContratoElectricidad">NO</b><label class="v120Switch"><input id="avContratoElectricidad" type="checkbox"><span class="v120Slider"></span></label></div></div><div style="font-size:11px;color:#667085;margin-top:7px">IBAN y contrato de electricidad quedan solo en la ficha del cliente y no se incorporan a la Memoria RES-CNMC.</div>';
var cups=d.getElementById('avCupsG'),anchor=cups&&cups.closest('label');if(anchor&&anchor.parentNode){var note=anchor.nextElementSibling;anchor.parentNode.insertBefore(box,note&&note.nextSibling?note.nextSibling:note)}else{var grid=d.querySelector('#formAviso .grid2');if(grid)grid.appendChild(box)}
['avCondicionesSuministro','avContratoElectricidad'].forEach(function(id){var x=d.getElementById(id);if(x)x.addEventListener('change',function(){updateSwitchText(d)})});
var oldNuevo=w.App.nuevoAviso,oldEditar=w.App.editarAviso,oldDuplicar=w.App.duplicarAviso,oldCancelar=w.App.cancelarAviso,oldGuardar=w.App.guardarAviso;
w.App.nuevoAviso=function(){var r=oldNuevo.apply(w.App,arguments);pendingFlags={condicionesSuministro:false,contratoElectricidad:false,iban:''};setTimeout(function(){setSwitches(pendingFlags)},0);return r};
w.App.editarAviso=function(id){var r=oldEditar.apply(w.App,arguments);pendingFlags=flagFor(id);setTimeout(function(){setSwitches(pendingFlags)},0);return r};
w.App.duplicarAviso=function(id){var r=oldDuplicar.apply(w.App,arguments);pendingFlags=flagFor(id);setTimeout(function(){setSwitches(pendingFlags)},0);return r};
w.App.cancelarAviso=function(){pendingFlags={condicionesSuministro:false,contratoElectricidad:false,iban:''};var r=oldCancelar.apply(w.App,arguments);setTimeout(function(){setSwitches(pendingFlags)},0);return r};
w.App.guardarAviso=function(){var d0=data(),before=(Array.isArray(d0.avisos)?d0.avisos:[]).map(function(x){return String(x.id)}),editId=Number((d.getElementById('avId')||{}).value)||0,f=readSwitches();if(f.iban&&!ibanValido(f.iban)){var st=d.getElementById('estadoAviso');if(st){st.textContent='IBAN no válido. Revísalo antes de guardar.';st.style.color='#b42318'}return false}var ib=d.getElementById('avIbanCliente');if(ib)ib.value=formatearIban(f.iban);var r=oldGuardar.apply(w.App,arguments);setTimeout(function(){var p=data(),arr=Array.isArray(p.avisos)?p.avisos:[],saved=editId;if(!saved){var news=arr.filter(function(x){return before.indexOf(String(x.id))<0});if(news.length)saved=Number(news[news.length-1].id)||0}if(saved)setFlag(saved,f);pendingFlags=f;fillOptions()},30);return r};
var sub=d.querySelector('header .headerText small');if(sub)sub.textContent='V1.20 PRUEBA · IBAN + condiciones + contrato';return true}
function waitInstall(){var tries=0,t=setInterval(function(){tries++;if(installSwitches()||tries>80)clearInterval(t)},150)}
el('base118').addEventListener('load',function(){setTimeout(waitInstall,80)});setTimeout(waitInstall,300);
window.renderMemoria=function(){fillOptions();var p=data(),a=Array.isArray(p.avisos)?p.avisos:[],id=Number(el('memSel').value)||0,x=a.find(function(v){return Number(v.id)===id}),b=el('memBox');if(!x){revoke();b.innerHTML='<div class="vacio">No hay un aviso seleccionado.</div>';return}var f=flagFor(x.id),e=p.empresa||{},t=p.tecnico||{},so=p.solicitante||{},logo=e.logoData?'<img src="'+e.logoData+'" alt="Logo empresa">':'',empresa=[e.nombreComercial||e.nombre,e.nif,e.telefono,e.email].filter(Boolean).join(' · '),dir=[x.direccion,x.cp,x.localidad,x.provincia].filter(Boolean).join(' · ');
b.innerHTML='<div class="doc"><div class="head">'+logo+'<div><h3>MEMORIA RES-CNMC · VISTA PREVIA</h3><small>'+esc(empresa||'Empresa no configurada')+'</small><small>Aviso '+esc(fecha(x.fecha))+' · '+esc(estado(x.estado))+'</small></div></div>'+ '<div class="sec"><h4>Empresa instaladora y técnico</h4><div class="grid">'+dato('Empresa',e.nombre||e.nombreComercial)+dato('NIF/CIF',e.nif)+dato('Dirección',[e.direccion,e.cp,e.localidad,e.provincia].filter(Boolean).join(' · '))+dato('Teléfono',e.telefono)+dato('Correo',e.email)+dato('Técnico',t.nombre)+dato('NIF técnico',t.nif)+dato('Nº instalador / habilitación',t.numero)+dato('Nº colegiado',t.colegiado)+'</div></div>'+ '<div class="sec"><h4>Solicitante</h4><div class="grid">'+dato('Nombre / razón social',so.nombre)+dato('NIF/CIF',so.nif)+dato('Teléfono',so.telefono)+dato('Correo',so.email)+dato('Dirección',[so.direccion,so.cp,so.localidad,so.provincia].filter(Boolean).join(' · '))+'</div></div>'+ '<div class="sec"><h4>Cliente y suministro</h4><div class="grid">'+dato('Cliente / razón social',x.cliente)+dato('Contacto',x.contacto)+dato('DNI/NIF/CIF',x.nif)+dato('Teléfono',x.telefono)+dato('Correo',x.email)+dato('Dirección del suministro',dir)+dato('Referencia catastral',x.refCatastral)+dato('CUPS electricidad',x.cupsE)+dato('CUPS gas',x.cupsG)+dato('Coordenadas WGS84',(x.latitud&&x.longitud)?x.latitud+', '+x.longitud:'')+dato('Condiciones de suministro',f.condicionesSuministro?'Sí':'No')+'</div></div>'+ '<div class="sec"><h4>Datos eléctricos</h4><div class="grid">'+dato('Tensión',x.tension)+dato('IGA',x.iga?x.iga+' A':'')+dato('Potencia calculada instalación',x.potenciaCalculada?x.potenciaCalculada+' kW':'')+dato('Potencia solicitada para condiciones de suministro',x.potenciaSolicitada?x.potenciaSolicitada+' kW':'')+'</div></div>'+ '<div class="sec"><h4>Objeto / observaciones</h4><div class="grid">'+dato('Concepto',x.concepto)+dato('Observaciones',x.observaciones)+'</div></div>'+ '<div class="sec"><h4>Plano de situación</h4><div id="memPlano" class="vacio">Cargando plano guardado…</div></div><div class="nota">IBAN y “Contrato de electricidad” se conservan únicamente en la ficha del cliente y no forman parte de esta Memoria RES-CNMC.</div></div>';
revoke();getPlan(String(x.id)).then(function(r){var c=el('memPlano');if(!c)return;if(!r||!r.blob){c.textContent='Este aviso no tiene plano guardado en la ficha.';return}planUrl=URL.createObjectURL(r.blob);c.className='plano';c.innerHTML='<img src="'+planUrl+'" alt="Plano de situación"><div class="nota">'+esc(r.nombre||'Plano guardado')+(r.generadoEn?' · '+esc(new Date(r.generadoEn).toLocaleString('es-ES')):'')+'</div>'}).catch(function(){var c=el('memPlano');if(c)c.textContent='No se pudo leer el plano guardado.'})}
window.showView=function(v){var app=v==='app';el('appView').style.display=app?'block':'none';el('memView').style.display=app?'none':'block';el('navApp').className=app?'active':'';el('navMem').className=app?'':'active';if(!app)renderMemoria()}
el('memSel').addEventListener('change',renderMemoria);recoverFlags().then(function(){fillOptions()});
})();
</script>
</body></html>
