<style>:root{--a:#0b5ed7;--f:#f4f7fb;--t:#182033;--m:#667085;--l:#dbe3ee}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:var(--f);color:var(--t)}body{height:100dvh;display:grid;grid-template-rows:1fr auto;overflow:hidden}.view{min-height:0}.hide{display:none!important}iframe{border:0;width:100%;height:100%;display:block}.pane{height:100%;overflow:auto;padding:14px 14px 90px}.card{max-width:900px;margin:0 auto 12px;background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px}h2{margin:0 0 8px;font-size:20px}h3{margin:0 0 8px;font-size:16px}.muted{color:var(--m);font-size:12px;line-height:1.45}label{display:block;font-size:12px;font-weight:700;color:var(--m);margin:10px 0}select{width:100%;margin-top:6px;padding:11px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;font-size:15px}button{font:inherit;border:1px solid var(--a);border-radius:11px;padding:11px 12px;font-weight:800;background:#fff;color:var(--a)}.full{width:100%}.stack{display:grid;gap:8px}.bottom{background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:20}.bottom button{border:0;background:transparent;color:#667085;padding:8px 4px}.bottom button.on{color:var(--a);background:#eef5ff}.doc{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;line-height:1.42}.sec{margin:15px 0}.sec h4{margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid var(--l);font-size:13px;color:#24466e;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr;gap:5px 14px}.dato{font-size:13px}.dato b{color:#344054}.plano img{width:100%;height:auto;border-radius:8px}.empty{padding:18px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:10px}.ok{padding:10px;border:1px solid #b7dfc3;background:#f2fbf5;border-radius:11px;font-size:12px;line-height:1.45}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head>
