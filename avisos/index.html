<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>APP Avisos V1.10</title>
<style>
:root{--azul:#0b5ed7;--fondo:#f4f7fb;--card:#fff;--texto:#182033;--muted:#6f7b8f;--linea:#dbe3ee;--rojo:#b42318;--verde:#15803d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:var(--fondo);color:var(--texto);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--linea);padding:13px 15px}header strong{font-size:18px}header small{display:block;color:var(--muted);margin-top:3px}
#bootState{margin-top:6px;font-size:11px;font-weight:800;color:#8a5a00}#bootState.ok{color:var(--verde)}#bootState.err{color:var(--rojo)}
main{padding:14px 14px 92px;max-width:900px;margin:0 auto}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 10px;font-size:16px}p{line-height:1.45}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0}
input,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;background:#fff;color:var(--texto)}textarea{min-height:90px;resize:vertical}
button{font:inherit;border:1px solid var(--azul);border-radius:12px;padding:12px 14px;font-weight:800;background:#fff;color:var(--azul);cursor:pointer}button.primary{background:var(--azul);color:#fff}.full{width:100%}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.notice{border:1px solid var(--linea);border-radius:13px;padding:11px;margin:8px 0;background:#fff}.notice strong{display:block}.notice small{display:block;color:var(--muted);margin-top:4px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:#667085;padding:9px 3px;font-size:13px;border-radius:10px}.bottom button.active{color:var(--azul);background:#eef5ff}
.status{font-size:12px;color:var(--verde);font-weight:800;margin-top:8px;min-height:16px}.muted{color:var(--muted);font-size:12px}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--linea);border-radius:12px}
@media(min-width:700px){main{padding:20px 20px 100px}.company-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.company-grid .wide{grid-column:1/-1}}
</style>
</head>
<body>
<header><strong>APP Avisos</strong><small>V1.10 · Base web estable</small><div id="bootState">INICIANDO APP…</div></header>
<main>
<section id="inicio" class="screen active"><div class="card"><h2>Inicio</h2><p class="muted">Base mínima para comprobar funcionamiento estable en móvil y tablet.</p><div id="resumenInicio"></div></div></section>
<section id="avisos" class="screen"><div class="card"><h2>Avisos</h2><button class="primary full" type="button" onclick="App.nuevoAviso()">＋ Nuevo aviso</button></div><div id="formAviso" class="card" style="display:none"><h3>Nuevo aviso</h3><label>Cliente<input id="avCliente" autocomplete="off"></label><label>Teléfono<input id="avTelefono" inputmode="tel" autocomplete="off"></label><label>Dirección<input id="avDireccion" autocomplete="off"></label><label>Concepto<textarea id="avConcepto"></textarea></label><div class="row"><button type="button" onclick="App.cancelarAviso()">Cancelar</button><button type="button" class="primary" onclick="App.guardarAviso()">Guardar aviso</button></div><div id="estadoAviso" class="status"></div></div><div class="card"><h3>Listado</h3><div id="listaAvisos"></div></div></section>
<section id="config" class="screen"><div class="card"><h2>Configuración</h2><h3>Empresa</h3><div class="company-grid"><label>Nombre de empresa<input id="empresaNombre" autocomplete="organization"></label><label>NIF / CIF<input id="empresaNif" autocomplete="off"></label><label>Teléfono<input id="empresaTelefono" inputmode="tel"></label><label>Correo electrónico<input id="empresaEmail" type="email" autocomplete="email"></label><label class="wide">Dirección<input id="empresaDireccion" autocomplete="street-address"></label><label>Código postal<input id="empresaCp" inputmode="numeric"></label><label>Localidad<input id="empresaLocalidad"></label><label class="wide">Provincia<input id="empresaProvincia"></label></div><button type="button" class="primary full" onclick="App.guardarEmpresa()">Guardar empresa</button><div id="estadoEmpresa" class="status"></div></div></section>
</main>
<nav class="bottom" aria-label="Navegación principal"><button type="button" id="navInicio" class="active" onclick="App.show('inicio')">⌂<br>Inicio</button><button type="button" id="navAvisos" onclick="App.show('avisos')">☰<br>Avisos</button><button type="button" id="navConfig" onclick="App.show('config')">⚙<br>Empresa</button></nav>
<script>
(function(){'use strict';var KEY='APP_AVISOS_WEB_DATOS_V1';var data={empresa:{nombre:'',nif:'',telefono:'',email:'',direccion:'',cp:'',localidad:'',provincia:''},avisos:[]};
function el(id){return document.getElementById(id);}function text(v){return v==null?'':String(v);}function esc(v){return text(v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}function blankEmpresa(){return {nombre:'',nif:'',telefono:'',email:'',direccion:'',cp:'',localidad:'',provincia:''};}
function load(){try{var raw=window.localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){var e=blankEmpresa(),src=p.empresa||{};Object.keys(e).forEach(function(k){e[k]=text(src[k]);});data.empresa=e;data.avisos=Array.isArray(p.avisos)?p.avisos:[];}}}catch(err){console.error('LOAD',err);}}
function save(){try{window.localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(err){console.error('SAVE',err);return false;}}
function renderInicio(){var nom=data.empresa.nombre||'Empresa no configurada';el('resumenInicio').innerHTML='<div class="notice"><strong>'+esc(nom)+'</strong><small>'+data.avisos.length+' aviso(s) guardado(s)</small></div>';}
function renderEmpresa(){var e=data.empresa;el('empresaNombre').value=text(e.nombre);el('empresaNif').value=text(e.nif);el('empresaTelefono').value=text(e.telefono);el('empresaEmail').value=text(e.email);el('empresaDireccion').value=text(e.direccion);el('empresaCp').value=text(e.cp);el('empresaLocalidad').value=text(e.localidad);el('empresaProvincia').value=text(e.provincia);}
function renderAvisos(){var box=el('listaAvisos');if(!data.avisos.length){box.innerHTML='<div class="empty">No hay avisos guardados.</div>';return;}var arr=data.avisos.slice().reverse();box.innerHTML=arr.map(function(a){return '<div class="notice"><strong>'+esc(a.cliente||'SIN CLIENTE')+'</strong><small>'+esc(a.direccion||'')+' · '+esc(a.telefono||'')+'</small><p>'+esc(a.concepto||'')+'</p></div>';}).join('');}
function resetAviso(){['avCliente','avTelefono','avDireccion','avConcepto'].forEach(function(id){el(id).value='';});el('estadoAviso').textContent='';}
window.App={show:function(id){try{['inicio','avisos','config'].forEach(function(s){el(s).className='screen'+(s===id?' active':'');});el('navInicio').className=id==='inicio'?'active':'';el('navAvisos').className=id==='avisos'?'active':'';el('navConfig').className=id==='config'?'active':'';if(id==='inicio')renderInicio();if(id==='avisos')renderAvisos();if(id==='config')renderEmpresa();window.scrollTo(0,0);}catch(err){el('bootState').textContent='ERROR DE NAVEGACIÓN: '+err.message;el('bootState').className='err';}},guardarEmpresa:function(){data.empresa={nombre:el('empresaNombre').value.trim(),nif:el('empresaNif').value.trim(),telefono:el('empresaTelefono').value.trim(),email:el('empresaEmail').value.trim(),direccion:el('empresaDireccion').value.trim(),cp:el('empresaCp').value.trim(),localidad:el('empresaLocalidad').value.trim(),provincia:el('empresaProvincia').value.trim()};el('estadoEmpresa').textContent=save()?'Empresa guardada.':'No se pudo guardar.';renderInicio();},nuevoAviso:function(){resetAviso();el('formAviso').style.display='block';setTimeout(function(){try{el('avCliente').focus();}catch(e){}},50);},cancelarAviso:function(){el('formAviso').style.display='none';resetAviso();},guardarAviso:function(){data.avisos.push({id:Date.now(),creado:new Date().toISOString(),cliente:el('avCliente').value.trim(),telefono:el('avTelefono').value.trim(),direccion:el('avDireccion').value.trim(),concepto:el('avConcepto').value.trim()});if(save()){el('formAviso').style.display='none';resetAviso();renderAvisos();renderInicio();}else{el('estadoAviso').textContent='No se pudo guardar.';}}};
try{load();renderInicio();renderEmpresa();renderAvisos();el('bootState').textContent='APP LISTA';el('bootState').className='ok';}catch(err){el('bootState').textContent='ERROR AL INICIAR: '+err.message;el('bootState').className='err';}})();
</script>
</body></html>
