<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>APP Avisos V1.26 · Copia total</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
body{height:100dvh}
iframe{display:block;border:0;width:100%;height:100%;background:#f4f7fb}
#backupBtn{position:fixed;right:14px;top:14px;z-index:50;border:0;border-radius:999px;background:#0b5ed7;color:#fff;padding:11px 14px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.22);font-size:14px}
#shade{display:none;position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.48);padding:14px;overflow:auto}
#panel{max-width:620px;margin:8vh auto;background:#fff;border-radius:18px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
#panel h2{margin:0 0 7px;font-size:20px}
.muted{font-size:12px;line-height:1.5;color:#667085}
.warn{margin:10px 0;padding:10px;border:1px solid #f0d59c;background:#fffaf0;border-radius:11px;color:#7c5700;font-size:12px;line-height:1.45}
.stack{display:grid;gap:9px;margin-top:12px}
button.action,label.action{display:block;width:100%;border:1px solid #0b5ed7;border-radius:11px;background:#fff;color:#0b5ed7;padding:12px;font:inherit;font-weight:800;text-align:center}
button.primary{background:#0b5ed7;color:#fff}
button.close{border-color:#cbd5e1;color:#475467}
input[type=file]{display:none}
#status{min-height:18px;margin-top:10px;font-size:12px;font-weight:700;color:#344054;line-height:1.45}
</style>
</head>
<body>
<iframe id="app126" title="APP Avisos V1.26" src="../avisos-v125/"></iframe>
<button id="backupBtn" type="button">💾 COPIA TOTAL</button>
<div id="shade">
  <div id="panel">
    <h2>Exportar / Importar TODO</h2>
    <div class="muted">Copia completa para trasladar APP Avisos entre tablet y Windows o para recuperar el trabajo después de una incidencia.</div>
    <div class="warn"><b>Contiene datos personales.</b> La copia puede incluir IBAN, fotografías, planos y datos de clientes. Guárdala en un lugar seguro.</div>
    <div class="stack">
      <button id="exportBtn" class="action primary" type="button">⬇ EXPORTAR TODO</button>
      <label class="action">⬆ IMPORTAR TODO<input id="importFile" type="file" accept="application/json,.json"></label>
      <button id="closeBtn" class="action close" type="button">Cerrar</button>
    </div>
    <div id="status"></div>
  </div>
</div>
<script src="./backup-all.js"></script>
</body>
</html>
