<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>APP Avisos V1.17C · Coordenadas + plano</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
body{height:100dvh}iframe{display:block;border:0;width:100%;height:100%;background:#f4f7fb}
#err{display:none;position:fixed;inset:12px;z-index:10;background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:16px;color:#b42318}
</style>
</head>
<body>
<div id="err"></div>
<iframe id="app" title="APP Avisos V1.17C" src="../avisos-v117b/"></iframe>
<script>
(function(){'use strict';
var fr=document.getElementById('app'),observer=null,autoTimer=null;
function err(msg){var b=document.getElementById('err');b.textContent=msg;b.style.display='block';}
function n(v){var x=parseFloat(String(v==null?'':v).replace(',','.'));return Number.isFinite(x)?x:null;}
function mercatorXY(lon,lat){var R=6378137,x=R*lon*Math.PI/180,cl=Math.max(-85.05112878,Math.min(85.05112878,lat)),y=R*Math.log(Math.tan(Math.PI/4+(cl*Math.PI/180)/2));return{x:x,y:y};}
function cargarImagen(url){return new Promise(function(resolve,reject){var im=new Image();im.crossOrigin='anonymous';im.onload=function(){resolve(im)};im.onerror=function(){reject(new Error('No se pudo cargar la cartografía IGN'))};im.src=url;});}
function nombrePlano(d){var base=(d.getElementById('avCliente').value||d.getElementById('avDireccion').value||'suministro').replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60);var x=new Date(),m=String(x.getMonth()+1).padStart(2,'0'),day=String(x.getDate()).padStart(2,'0');return 'plano_'+(base||'suministro')+'_'+x.getFullYear()+'-'+m+'-'+day+'.png';}
function descargarPlano(){
  try{
    var d=fr.contentDocument,lat=n(d.getElementById('avLatitud').value),lon=n(d.getElementById('avLongitud').value);
    if(lat===null||lon===null){var s=d.getElementById('cartoEstado');if(s){s.textContent='Primero obtén las coordenadas del suministro.';s.style.color='#b42318'}return;}
    var estado=d.getElementById('cartoEstado');if(estado){estado.textContent='Preparando plano PNG…';estado.style.color='#15803d'}
    var p=mercatorXY(lon,lat),hx=220,hy=165,W=1200,H=900,bbox=[p.x-hx,p.y-hy,p.x+hx,p.y+hy].join(',');
    var url='https://www.ign.es/wms-inspire/ign-base?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=IGNBaseTodo&STYLES=&CRS=EPSG:3857&BBOX='+encodeURIComponent(bbox)+'&WIDTH='+W+'&HEIGHT='+H+'&FORMAT=image/png&TRANSPARENT=FALSE';
    cargarImagen(url).then(function(im){
      var c=document.createElement('canvas');c.width=W;c.height=H+150;var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,W,H);
      var px=W/2,py=H/2;ctx.beginPath();ctx.arc(px,py,16,0,Math.PI*2);ctx.fillStyle='#d92d20';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.moveTo(px,py+14);ctx.lineTo(px,py+42);ctx.lineWidth=7;ctx.strokeStyle='#d92d20';ctx.stroke();
      ctx.fillStyle='#fff';ctx.fillRect(0,H,W,150);ctx.fillStyle='#182033';ctx.font='bold 28px Arial';ctx.fillText('PLANO DE SITUACIÓN',28,H+38);ctx.font='20px Arial';
      var vals=['avDireccion','avCp','avLocalidad','avProvincia'].map(function(id){return d.getElementById(id).value.trim()}).filter(Boolean);ctx.fillText((vals.join(' · ')||'Suministro').slice(0,100),28,H+72);
      var ref=d.getElementById('avRefCatastral').value.trim();ctx.font='18px Arial';ctx.fillText('Coordenadas WGS84: '+lat+', '+lon+(ref?'   ·   Ref. catastral: '+ref:''),28,H+104);ctx.font='15px Arial';ctx.fillStyle='#667085';ctx.fillText('Cartografía base: © Instituto Geográfico Nacional · APP Avisos',28,H+133);
      c.toBlob(function(blob){if(!blob){if(estado){estado.textContent='No se pudo generar el PNG.';estado.style.color='#b42318'}return;}var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombrePlano(d);document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);if(estado){estado.textContent='Plano PNG descargado en el terminal.';estado.style.color='#15803d'}},'image/png',0.95);
    }).catch(function(e){console.warn(e);if(estado){estado.textContent='No se pudo generar el PNG automáticamente. Usa Ver plano CartoCiudad como alternativa.';estado.style.color='#b42318'}});
  }catch(e){console.warn(e);err('Error al generar el plano: '+e.message)}
}
function programarAuto(){clearTimeout(autoTimer);autoTimer=setTimeout(function(){try{var d=fr.contentDocument,w=fr.contentWindow,box=d.getElementById('cartoResultados'),lat=d.getElementById('avLatitud'),lon=d.getElementById('avLongitud');if(box&&box.querySelector('.cartoResult')&&lat&&lon&&!lat.value&&!lon.value&&w.App&&typeof w.App.elegirCarto==='function')w.App.elegirCarto(0);}catch(e){console.warn('Auto coords',e)}},150);}
function instalar(){
  try{
    var d=fr.contentDocument,w=fr.contentWindow;if(!d||!w.App)throw new Error('La aplicación base no terminó de cargar');
    d.title='APP Avisos V1.17C';var sub=d.querySelector('header .headerText small');if(sub)sub.textContent='V1.17C PRUEBA · Coordenadas automáticas + plano';var intro=d.querySelector('#inicio .muted');if(intro)intro.textContent='V1.17C obtiene coordenadas automáticamente y permite descargar un plano PNG del suministro.';
    var actions=d.querySelector('.coordActions');if(actions&&!d.getElementById('btnDescargarPlano')){var b=d.createElement('button');b.id='btnDescargarPlano';b.type='button';b.textContent='⬇ Descargar plano PNG';b.style.gridColumn='1/-1';b.onclick=descargarPlano;actions.appendChild(b);}
    var box=d.getElementById('cartoResultados');if(box){observer=new MutationObserver(programarAuto);observer.observe(box,{childList:true,subtree:true});}
    var oldDir=w.App.buscarCartoDireccion,oldRef=w.App.buscarCartoRef;if(typeof oldDir==='function')w.App.buscarCartoDireccion=function(){var lat=d.getElementById('avLatitud'),lon=d.getElementById('avLongitud');if(lat)lat.value='';if(lon)lon.value='';oldDir.apply(w.App,arguments);programarAuto();};if(typeof oldRef==='function')w.App.buscarCartoRef=function(){var lat=d.getElementById('avLatitud'),lon=d.getElementById('avLongitud');if(lat)lat.value='';if(lon)lon.value='';oldRef.apply(w.App,arguments);programarAuto();};
  }catch(e){console.warn(e);err('No se pudo iniciar V1.17C: '+e.message)}
}
fr.addEventListener('load',function(){setTimeout(instalar,250)});
})();
</script>
</body></html>
